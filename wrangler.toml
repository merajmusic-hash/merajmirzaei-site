name = "merajmirzaei-site"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./merajmirzaei-site (4)"
binding = "ASSETS"
run_worker_first = true

# Trivial redeploy trigger (2026-09-04): pick up the ADMIN_PASSWORD and
# GITHUB_TOKEN secrets, now correctly set as Runtime secrets under
# Settings, rather than the Builds-time variables used previously.

# Song comments on the homepage New Release player (see handlePostComment
# in src/worker.js). Namespace "merajmirzaei-comments" in the Cloudflare
# account that owns this Worker.
[[kv_namespaces]]
binding = "COMMENTS"
id = "148c52e34410416da2657be76c3b26e4"

# Collaboration submissions from the /collaborate page are stored in the
# same KV namespace above (keys s:/sf:), and each new one is emailed to
# the site owner through this binding (see handlePostCollab in
# src/worker.js). It only delivers once Email Routing is enabled for
# merajmirzaei.com in the Cloudflare dashboard (Email > Email Routing)
# and this address is a verified destination address there. Until then
# submissions are still saved; only the email is skipped, and the admin
# "Submissions" tab shows why.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "merajmusic2@gmail.com"
