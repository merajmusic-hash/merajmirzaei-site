  // ---------------------------------------------------------------------
  // delegated input/change/click handling on the whole wrap — id-addressed
  // (not index-addressed), since the credits tab renders entries split
  // across several artist-block tables rather than one flat tbody.
  // ---------------------------------------------------------------------

  wrap.addEventListener('input', function(e){
    var t = e.target;
    var lyrId = t.getAttribute('data-lyr');
    if(lyrId != null){
      state.lyrics[lyrId] = t.value;
      state.lyricsDirty = true; setDirty();
      updateLyricsRow(lyrId, t.closest('tr'));
      return;
    }
    if(lyricsControlInput(t, false)) return;
    var galId = t.getAttribute('data-gal');
    if(galId != null){
      var g = galById(galId);
      var gField = t.getAttribute('data-field');
      if(!g || (gField !== 'caption_en' && gField !== 'caption_fa')) return;
      g[gField] = t.value;
      state.galleryDirty = true; setDirty();
      return;
    }
    var nrId = t.getAttribute('data-nr');
    if(nrId != null && t.type !== 'file'){
      var nr = nrById(nrId);
      var nrField = t.getAttribute('data-field');
      if(!nr || !nrField) return;
      nr[nrField] = t.value;
      if(nrField === 'youtube_url'){
        var bad = !!t.value && !youtubeId(t.value);
        t.classList.toggle('bad', bad);
        t.title = bad ? 'Not a YouTube link' : '';
      }
      state.newReleasesDirty = true; setDirty();
      return;
    }
    var id = t.getAttribute('data-id');
    var field = t.getAttribute('data-field');
    if(id != null && field){
      var entry = entryById(id);
      if(!entry) return;
      state.entriesDirty = true; setDirty();
      if(field === 'link-label' || field === 'link-url'){
        var li = Number(t.getAttribute('data-li'));
        if(!entry.links[li]) return;
        entry.links[li][field === 'link-label' ? 'label' : 'url'] = t.value;
        return;
      }
      entry[field] = t.value;
      if(field === 'cover_url'){
        delete entry._coverPreview;
        var thumb = t.closest('td').querySelector('.cover-thumb');
        if(thumb && thumb.tagName === 'IMG'){ thumb.setAttribute('data-src', t.value); thumb.setAttribute('data-retry', '0'); thumb.src = t.value; }
      }
      return;
    }
    var oid = t.getAttribute('data-oid');
    var hfield = t.getAttribute('data-field');
    if(oid != null && hfield === 'artist_en'){
      var h = state.homepage.filter(function(x){ return String(x._oid) === oid; })[0];
      if(!h) return;
      h.artist_en = t.value;
      state.homepageDirty = true; setDirty();
    }
  });

  // Regroup the credits tab as soon as an artist name edit is committed
  // (blur), rather than on every keystroke — typing must never trigger a
  // structural re-render (it would steal focus mid-edit), but leaving a
  // renamed track sitting in its old artist's block indefinitely would be
  // confusing, so the group boundary is refreshed the moment the field is
  // no longer being actively typed into.
  wrap.addEventListener('keydown', function(e){
    var t = e.target;
    if(e.key === 'Enter' && t.getAttribute && t.getAttribute('data-gal-person') != null){
      e.preventDefault();
      galAddPerson(t.getAttribute('data-gal-person'), t.value);
    }
  });

  wrap.addEventListener('focusout', function(e){
    var t = e.target;
    if(state.tab === 'newrelease' && t.getAttribute && t.getAttribute('data-field') === 'youtube_url'){
      // Refresh just this row's thumbnail — a full re-render here would
      // swallow a click on another button that caused this blur.
      var nrRow = t.closest('tr');
      var nrIt = nrById(t.getAttribute('data-nr'));
      if(nrRow && nrIt && nrRow.children[2]) nrRow.children[2].innerHTML = nrThumb(nrIt);
      return;
    }
    if(state.tab === 'credits' && t.getAttribute && t.getAttribute('data-field') === 'artist_en'){
      render();
    }
  }, true);

  wrap.addEventListener('change', function(e){
    var t = e.target;
    if(lyricsControlInput(t, true)) return;
    if(t.id === 'lyrOnlyEmpty'){
      state.lyricsOnlyEmpty = t.checked;
      render();
      return;
    }
    var id = t.getAttribute('data-id');
    var field = t.getAttribute('data-field');
    if(id != null && field){
      var entry = entryById(id);
      if(!entry) return;
      if(field === 'page-credits' || field === 'page-releases'){
        setPage(entry, field === 'page-credits' ? 'credits' : 'releases', t.checked);
        state.entriesDirty = true; setDirty();
        render();
        return;
      }
      if(t.tagName === 'SELECT'){ entry[field] = t.value; state.entriesDirty = true; setDirty(); return; }
      if(t.type === 'checkbox'){ entry[field] = t.checked; state.entriesDirty = true; setDirty(); return; }
    }
    if(t.tagName === 'SELECT' && t.getAttribute('data-nr') != null){
      var nrs = nrById(t.getAttribute('data-nr'));
      if(!nrs) return;
      nrs.release_id = t.value;
      var rel = entryById(t.value);
      if(rel){
        nrs.title_en = rel.title_en || nrs.title_en;
        nrs.title_fa = rel.title_fa || nrs.title_fa;
      }
      state.newReleasesDirty = true; setDirty();
      render();
      return;
    }
    if(t.getAttribute('data-gal-person') != null){
      galAddPerson(t.getAttribute('data-gal-person'), t.value);
      return;
    }
    if(t.type === 'file' && t.getAttribute('data-gal-files') != null){
      var gfiles = t.files;
      galAddFiles(gfiles);
      t.value = '';
      return;
    }
    if(t.type === 'file' && t.getAttribute('data-nr') != null){
      var nrItem = nrById(t.getAttribute('data-nr'));
      var vfile = t.files[0];
      t.value = '';
      if(nrItem && vfile) nrUpload(nrItem, vfile);
      return;
    }
    if(t.type === 'file'){
      var fileId = t.getAttribute('data-id');
      var entry2 = entryById(fileId);
      var file = t.files[0];
      if(!file || !entry2) return;
      var allowed = {'image/jpeg':1,'image/png':1,'image/webp':1};
      if(!allowed[file.type]){ showMsg('Unsupported image type. Use JPEG, PNG or WebP.', 'err'); return; }
      if(file.size > 8*1024*1024){ showMsg('Image too large (max 8MB).', 'err'); return; }
      if(entry2._coverUploading){ showMsg('Wait for this cover upload to finish.', 'err'); return; }
      entry2._coverUploading = true;
      state.coverUploads++;
      showMsg('Preparing cover…', 'ok');
      prepareImage(file, 1200, 0.85, 1024*1024).then(function(prep){
        return fetch('/admin/api/upload-image', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ filenameHint: entry2.title_en || entry2.artist_en, mime: 'image/jpeg', contentBase64: prep.base64 })
        }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j, blob:prep.blob}; }); });
      }).then(function(res){
        if(!res.ok || !res.j.ok) throw new Error(res.j.error || 'unknown error');
        if(entryById(fileId) !== entry2) return; // removed while uploading
        entry2.cover_url = res.j.path;
        if(entry2._coverPreview) URL.revokeObjectURL(entry2._coverPreview);
        entry2._coverPreview = URL.createObjectURL(res.blob);
        state.entriesDirty = true; setDirty();
        showMsg('Cover uploaded. Press Save to put it on the site.', 'ok');
        render();
      }).catch(function(err){ showMsg('Upload failed: ' + err.message, 'err'); })
        .finally(function(){ entry2._coverUploading = false; state.coverUploads--; });
      t.value = '';
    }
  });

  wrap.addEventListener('click', function(e){
    var t = e.target;
    var action = t.getAttribute('data-action');
    if(!action) return;
    if(action === 'lyrics-format'){ lyricsFormatAction(t); return; }
    if(action === 's-more'){ loadSubmissions(true); return; }
    if(action === 'delete-row'){
      var id = t.getAttribute('data-id');
      var entry = entryById(id);
      if(!entry) return;
      if(!confirm('Delete this row? This only takes effect once you Save.')) return;
      state.entries.splice(state.entries.indexOf(entry), 1);
      state.entriesDirty = true; setDirty();
      render();
    } else if(action === 'add-link'){
      var id2 = t.getAttribute('data-id');
      var entry2 = entryById(id2);
      if(!entry2) return;
      entry2.links = entry2.links || [];
      entry2.links.push({ label:'', url:'' });
      state.entriesDirty = true; setDirty();
      render();
    } else if(action === 'remove-link'){
      var id3 = t.getAttribute('data-id');
      var entry3 = entryById(id3);
      if(!entry3) return;
      var li = Number(t.getAttribute('data-li'));
      entry3.links.splice(li, 1);
      state.entriesDirty = true; setDirty();
      render();
    } else if(action === 'upload-cover'){
      var input = t.parentElement.querySelector('.upload-input');
      if(input) input.click();
    } else if(action === 'goto-lyrics'){
      state.tab = 'lyrics';
      state.lyricsFocus = t.getAttribute('data-id');
      state.lyricsOnlyEmpty = false;
      filterEl.value = '';
      render();
    } else if(action === 'c-approve'){
      commentAction('/admin/api/comments/approve', { id: t.getAttribute('data-id') }, 'Approved — it will show on the site within a minute.');
    } else if(action === 'c-delete'){
      commentAction('/admin/api/comments/delete', { key: t.getAttribute('data-key') }, 'Deleted.');
    } else if(action === 's-read'){
      subAction('/admin/api/submissions/mark', { id: t.getAttribute('data-id'), read: t.getAttribute('data-read') === '1' }, 'Updated.');
    } else if(action === 's-delete'){
      if(!confirm('Delete this submission and its files for good?')) return;
      subAction('/admin/api/submissions/delete', { id: t.getAttribute('data-id') }, 'Deleted.');
    } else if(action === 'gal-add'){
      var ginput = wrap.querySelector('input[type=file][data-gal-files]');
      if(ginput) ginput.click();
    } else if(action === 'gal-person-remove'){
      var gp = galById(t.getAttribute('data-gal'));
      if(!gp || !gp.people) return;
      gp.people.splice(Number(t.getAttribute('data-i')), 1);
      state.galleryDirty = true; setDirty();
      render();
    } else if(action === 'gal-delete'){
      var gd = galById(t.getAttribute('data-gal'));
      if(!gd) return;
      if(!confirm('Remove this photo from the gallery? This only takes effect once you Save.')) return;
      state.gallery = state.gallery.filter(function(x){ return x !== gd; });
      state.gallery.slice().sort(byOrder).forEach(function(x, k){ x.order = k; });
      state.galleryDirty = true; setDirty();
      render();
    } else if(action === 'nr-add'){
      nrAdd();
    } else if(action === 'nr-upload'){
      var vinput = t.closest('td').querySelector('input[type=file][data-nr]');
      if(vinput) vinput.click();
    } else if(action === 'nr-clear-file'){
      var nrc = nrById(t.getAttribute('data-nr'));
      if(!nrc) return;
      nrc.video_url = '';
      state.newReleasesDirty = true; setDirty();
      render();
    } else if(action === 'nr-delete'){
      var nrd = nrById(t.getAttribute('data-nr'));
      if(!nrd) return;
      if(nrd._uploading != null){ showMsg('Wait for the upload to finish first.', 'err'); return; }
      state.newReleases = state.newReleases.filter(function(x){ return x !== nrd; });
      state.newReleases.slice().sort(byOrder).forEach(function(x, k){ x.order = k; });
      state.newReleasesDirty = true; setDirty();
      render();
    } else if(action === 'delete-homepage-row'){
      var oid = t.getAttribute('data-oid');
      state.homepage = state.homepage.filter(function(h){ return String(h._oid) !== oid; });
      state.homepageDirty = true; setDirty();
      render();
    }
  });

  addRowBtn.addEventListener('click', function(){
    var pages = state.tab === 'releases' ? ['releases'] : ['credits'];
    state.entries.push(blankEntry(pages));
    state.entriesDirty = true; setDirty();
    render();
    wrap.scrollTop = wrap.scrollHeight; // the table area scrolls, not the page
  });

  // ---------------------------------------------------------------------
  // export — read-only: builds a file entirely from state.entries (the
  // data already loaded into the browser) and never touches the save
  // API, so it cannot modify data/credits.json. Exports every field of
  // every entry regardless of which tab or filter is currently active —
  // this is a full backup/download, not a view export.
  // ---------------------------------------------------------------------

  var EXPORT_FIELDS = [
    'id', 'order', 'pages', 'artist_en', 'artist_fa', 'artist_image', 'spotify_artist_url',
    'title_en', 'title_fa', 'release_type', 'album_name', 'year', 'label',
    'role_arrangement', 'role_production', 'role_mix', 'role_mastering',
    'links', 'start_seconds', 'cover_url',
    'status_musicbrainz', 'status_discogs', 'status_genius', 'notes',
  ];

  function todayStamp(){
    var d = new Date();
    function pad(n){ return n < 10 ? '0'+n : ''+n; }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function downloadFile(filename, content, mime){
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // A link is {label, url}; a cell can only hold one string, so each link
  // renders as "label: url" (or bare url when there's no label), joined
  // by " | " — readable directly in Excel/Sheets. The JSON export carries
  // the exact original array for anything that needs it losslessly.
  function formatLinksForCsv(links){
    return (Array.isArray(links) ? links : []).map(function(l){
      if(!l) return '';
      return l.label ? (l.label + ': ' + l.url) : (l.url || '');
    }).join(' | ');
  }

  function csvCell(value){
    var s = value == null ? '' : String(value);
    if(/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function buildCsv(entries){
    var rows = [EXPORT_FIELDS.join(',')];
    entries.forEach(function(entry){
      var row = EXPORT_FIELDS.map(function(field){
        if(field === 'links') return csvCell(formatLinksForCsv(entry.links));
        if(field === 'pages') return csvCell((entry.pages||[]).join(';'));
        return csvCell(entry[field]);
      });
      rows.push(row.join(','));
    });
    // A leading UTF-8 BOM so Excel (which otherwise guesses the system
    // codepage) renders the Farsi text correctly instead of mangling it;
    // Google Sheets reads UTF-8 fine either way. Written via
    // fromCharCode rather than a literal character in this file, since an
    // invisible character in source is easy to lose or corrupt by accident.
    return String.fromCharCode(0xFEFF) + rows.join('\r\n') + '\r\n';
  }

  document.getElementById('exportCsvBtn').addEventListener('click', function(){
    downloadFile('credits-' + todayStamp() + '.csv', buildCsv(state.entries), 'text/csv;charset=utf-8');
  });
  document.getElementById('exportJsonBtn').addEventListener('click', function(){
    downloadFile('credits-' + todayStamp() + '.json', JSON.stringify(state.entries, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }, 2), 'application/json;charset=utf-8');
  });

  // ---------------------------------------------------------------------
  // save — independently tracks credits.json and homepage.json dirtiness
  // and sha, since they're two separate files/commits on the GitHub side.
  // ---------------------------------------------------------------------

  function savePayload(kind){
    if(kind === 'entries') return state.entries.map(function(e){
      var o = {}; for(var k in e){ if(k.charAt(0) !== '_') o[k] = e[k]; } return o;
    });
    if(kind === 'homepage') return state.homepage.slice().sort(byOrder).map(function(h){ return { artist_en:h.artist_en, order:h.order }; });
    if(kind === 'newReleases') return state.newReleases.slice().sort(byOrder).map(function(it, k){
      return { id:it.id, release_id:it.release_id || '', title_en:(it.title_en || '').trim(), title_fa:(it.title_fa || '').trim(),
        youtube_url:it.video_url ? '' : (it.youtube_url || '').trim(), video_url:it.video_url || '', order:k };
    });
    if(kind === 'gallery') return state.gallery.slice().sort(byOrder).map(function(it, k){
      return { id:it.id, src:it.src, people:(it.people || []).map(function(n){ return String(n).trim(); }).filter(Boolean),
        caption_en:(it.caption_en || '').trim(), caption_fa:(it.caption_fa || '').trim(), order:k };
    });
    var order = state.entries.map(function(e){ return e.id; });
    Object.keys(state.lyrics).forEach(function(id){ if(order.indexOf(id) === -1) order.push(id); });
    Object.keys(state.lyricsMeta).forEach(function(id){ if(order.indexOf(id) === -1) order.push(id); });
    return order.filter(function(id){ return lyricsHas(id) || lyricsHasDetails(id); }).map(function(id){
      var meta = lyricsMetaFor(id); return { id:id, lyrics:String(state.lyrics[id] || ''), poet:meta.poet.trim(), layout:meta.layout };
    });
  }

  function save(){
    if(state.saving) return;
    // Finish every preflight check before sending the first request.
    if(state.coverUploads || nrUploading() || state.galUpload){
      showMsg('An upload is still running. Save once it finishes.', 'err'); return;
    }
    if(state.lyricsDirty && !state.lyricsLoaded){
      showMsg('The lyrics did not load, so they cannot be saved. Reload the page.', 'err'); return;
    }
    var paths = { entries:'save', homepage:'save-homepage', newReleases:'save-new-releases', gallery:'gallery/save', lyrics:'save-lyrics' };
    var pending = Object.keys(paths).filter(function(kind){ return state[kind+'Dirty']; }).map(function(kind){
      var sent = savePayload(kind);
      var body = { content:sent, sha:state[kind+'Sha'] };
      if(kind === 'gallery') body.newFiles = state.gallery.filter(function(it){ return it._blob; })
        .map(function(it){ return { src:it.src, blobSha:it._blob }; });
      return { kind:kind, sent:sent, snapshot:JSON.stringify(sent), body:body };
    });
    if(!pending.length){ showMsg('Nothing to save.', 'ok'); return; }
    state.saving = true;
    var buttons = [document.getElementById('saveBtn'), document.getElementById('saveBtn2')];
    buttons.forEach(function(btn){ btn.disabled = true; });
    showMsg('Saving…', 'ok');
    return Promise.all(pending.map(function(job){
      // A failed request must not hide the SHA returned by another success.
      return Promise.resolve().then(function(){
        return fetch('/admin/api/' + paths[job.kind], {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(job.body)
        });
      }).then(function(r){ return r.json().then(function(j){ return { job:job, ok:r.ok && !!j.ok, j:j }; }); })
        .catch(function(err){ return { job:job, ok:false, j:{error:err.message} }; });
    })).then(function(results){
      results.forEach(function(r){
        if(!r.ok) return;
        var job = r.job, kind = job.kind;
        var unchanged = JSON.stringify(savePayload(kind)) === job.snapshot;
        state[kind+'Sha'] = r.j.sha || state[kind+'Sha'];
        state[kind+'Dirty'] = !unchanged;
        if(kind === 'lyrics'){
          state.lyricsSaved = {};
          job.sent.forEach(function(row){ state.lyricsSaved[row.id] = !!LyricsFormat.cleanText(row.lyrics); });
          if(unchanged && state.tab === 'lyrics') render();
        }
        if(kind === 'gallery'){
          // Clear only blobs in this request. Keep photos added in flight.
          (r.j.content || []).forEach(function(saved){
            var original = job.sent.filter(function(row){ return row.id === saved.id; })[0];
            var it = galById(saved.id);
            if(!it || !original || it.src !== original.src) return;
            var upload = (job.body.newFiles || []).filter(function(f){ return f.src === original.src; })[0];
            if(upload && it._blob === upload.blobSha) delete it._blob;
            if(saved.src && saved.src !== it.src){
              if(!it._preview) it._preview = it.src;
              it.src = saved.src;
            }
          });
          if(unchanged && state.tab === 'gallery') render();
        }
      });
      setDirty();
      var failed = results.filter(function(r){ return !r.ok; });
      if(failed.length){
        showMsg('Some changes were not saved: ' + failed.map(function(r){ return r.job.kind + ': ' + (r.j.error || 'unknown error'); }).join('; ')
          + '. Successful saves are recorded; unsaved changes remain here.', 'err');
      } else if(Object.keys(paths).some(function(kind){ return state[kind+'Dirty']; })){
        showMsg('Submitted changes saved. Your newer edits are still unsaved — press Save again.', 'ok');
      } else {
        showMsg('Saved. Cloudflare will rebuild the site automatically (usually under a minute).', 'ok');
      }
    }).finally(function(){
      state.saving = false;
      buttons.forEach(function(btn){ btn.disabled = false; });
    });
  }
  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('saveBtn2').addEventListener('click', save);

  window.addEventListener('beforeunload', function(e){
    if(state.entriesDirty || state.homepageDirty || state.newReleasesDirty || state.galleryDirty || state.lyricsDirty || state.saving || state.coverUploads || state.galUpload || nrUploading()){ e.preventDefault(); e.returnValue = ''; }
  });

  // ---------------------------------------------------------------------
  // initial load — credits.json and homepage.json load in parallel; each
  // keeps its own sha for independent optimistic-concurrency saves.
  // ---------------------------------------------------------------------

  showMsg('Loading…', 'ok');
  Promise.all([
    fetch('/admin/api/credits').then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); }),
    fetch('/admin/api/homepage').then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); }),
    fetch('/admin/api/new-releases').then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .catch(function(err){ return {ok:false, j:{error: err.message}}; }),
    fetch('/admin/api/gallery').then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .catch(function(err){ return {ok:false, j:{error: err.message}}; }),
    fetch('/admin/api/lyrics').then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .catch(function(err){ return {ok:false, j:{error: err.message}}; }),
  ]).then(function(results){
    var creditsRes = results[0], homepageRes = results[1], nrRes = results[2], galRes = results[3], lyrRes = results[4];
    if(!creditsRes.ok){ showMsg('Load failed: ' + (creditsRes.j.error||'unknown error'), 'err'); return; }
    state.entries = creditsRes.j.data || [];
    state.entriesSha = creditsRes.j.sha;
    if(homepageRes.ok){
      state.homepage = (homepageRes.j.data || []).map(function(h){ return { _oid: homepageOid(), artist_en: h.artist_en, order: h.order }; });
      state.homepageSha = homepageRes.j.sha;
    } else {
      showMsg('Homepage list failed to load: ' + (homepageRes.j.error||'unknown error'), 'err');
    }
    if(nrRes.ok){
      state.newReleases = (nrRes.j.data || []).map(function(it, k){
        return {
          id: it.id || nrNewId(),
          release_id: it.release_id || '',
          title_en: it.title_en || '', title_fa: it.title_fa || '',
          youtube_url: it.youtube_url || '', video_url: it.video_url || '',
          order: typeof it.order === 'number' ? it.order : k,
        };
      });
      state.newReleasesSha = nrRes.j.sha;
    }
    if(creditsRes.ok && homepageRes.ok) showMsg('', '');
    if(!nrRes.ok) showMsg('New Release list failed to load: ' + (nrRes.j.error||'unknown error'), 'err');
    if(galRes.ok){
      state.gallery = (galRes.j.data || []).map(function(it, k){
        return {
          id: it.id || galNewId(), src: it.src || '',
          people: Array.isArray(it.people) ? it.people.slice() : [],
          caption_en: it.caption_en || '', caption_fa: it.caption_fa || '',
          order: typeof it.order === 'number' ? it.order : k,
        };
      });
      state.gallerySha = galRes.j.sha;
    } else {
      showMsg('Gallery failed to load: ' + (galRes.j.error||'unknown error'), 'err');
    }
    if(lyrRes.ok){
      state.lyrics = {}; state.lyricsMeta = {}; state.lyricsUndo = {}; state.lyricsSaved = {};
      (lyrRes.j.data || []).forEach(function(row){
        if(row && typeof row.id === 'string' && typeof row.lyrics === 'string'){ state.lyrics[row.id] = row.lyrics; state.lyricsMeta[row.id] = {poet:typeof row.poet === 'string' ? row.poet : '', layout:LyricsFormat.normalizeLayout(row.layout)}; state.lyricsSaved[row.id] = !!LyricsFormat.cleanText(row.lyrics); }
      });
      state.lyricsSha = lyrRes.j.sha;
      state.lyricsLoaded = true;
    } else {
      state.lyricsError = lyrRes.j.error || 'unknown error';
      showMsg('Lyrics failed to load: ' + state.lyricsError, 'err');
    }
    render();
    loadComments();
    loadSubmissions();
  }).catch(function(err){ showMsg('Load failed: ' + err.message, 'err'); });
})();
</script>
