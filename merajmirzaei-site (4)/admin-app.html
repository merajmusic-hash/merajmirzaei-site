<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Site admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#0B0D10; --panel:#14181D; --panel-2:#1B2027; --line:#262D36;
    --brass:#C2A878; --text:#E7E4DE; --muted:#8B95A1;
    --good:#7FBF7F; --bad:#e08585; --fa:Vazirmatn,system-ui,sans-serif; --body:"Inter Tight",system-ui,sans-serif;
    --header-h:56px; /* kept in sync with the real <header> height by JS */
  }
  *{box-sizing:border-box}
  /* The page itself never scrolls: header, messages and footer stay put and
     only the table area (.wrap) scrolls, in both directions. That makes
     .wrap the one scroll box the sticky column headers and frozen columns
     are measured against, so the headers sit on top of the rows and stay
     visible while scrolling. */
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--text);font-family:system-ui,sans-serif;font-size:13px;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  body > header, body > #msg, body > .filter-active-note, body > footer{flex:none}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.97);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  header .spacer{flex:1}
  input[type=text], input[type=search], input[type=number]{background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);border-radius:4px;padding:6px 9px;font-size:13px}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 9px;font-size:13px}
  button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);padding:7px 12px}
  button:hover{border-color:var(--brass)}
  button.primary{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
  button.danger{color:var(--bad)}
  button.small{padding:3px 8px;font-size:11px}
  a.hdr-link{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;
    background:var(--panel-2);color:var(--text);text-decoration:none}
  a.hdr-link:hover{border-color:var(--brass)}
  .msg{padding:8px 12px;border-radius:4px;font-size:13px;margin:0 16px}
  .msg.ok{background:rgba(127,191,127,.12);color:var(--good);border:1px solid rgba(127,191,127,.3)}
  .msg.err{background:rgba(224,133,133,.12);color:var(--bad);border:1px solid rgba(224,133,133,.3)}

  .tabs{display:flex;gap:4px}
  .tab-btn{background:transparent;border-color:transparent;color:var(--muted)}
  .tab-btn.active{background:var(--panel-2);border-color:var(--line);color:var(--text);font-weight:700}

  /* No top padding on the scroll box itself: sticky headers stop at a
     scroll container's padding edge, which would leave a strip of scrolled
     rows showing above them. The first child gets that space instead. */
  .wrap{padding:0 16px 16px;overflow:auto;flex:1 1 auto;min-height:0}
  .wrap > :first-child{margin-top:16px}
  /* Column headers stick to the top of .wrap's scroll box (top:0). They
     used to use top:var(--header-h) to clear the page header, but .wrap is
     itself a scroll container, so that offset was applied inside it and
     pushed every header row down on top of the first data row. */
  table{border-collapse:collapse;table-layout:fixed}
  .homepage-table{min-width:640px;table-layout:auto}
  th, td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
  th{background:var(--panel);position:sticky;top:-1px;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);white-space:nowrap;z-index:5}
  /* Frozen identifying columns (Pages, Artist EN, Title EN): pinned to the
     left edge of the horizontally-scrolling .wrap so the row stays
     identifiable while scrolling right to reach the later columns. Solid
     backgrounds prevent scrolled-under content from showing through. */
  .col-pages, .col-frozen{position:sticky;z-index:3;background:var(--ink)}
  .col-pages{left:0}
  .col-frozen.artist-en{left:56px}
  .col-frozen.title-en{left:176px}
  thead .col-pages, thead .col-frozen{z-index:6;background:var(--panel)}
  td input[type=text], td input[type=number], td textarea, td select{
    width:100%;background:var(--panel-2);border:1px solid transparent;color:var(--text);
    border-radius:3px;padding:4px 5px;font-size:12px;font-family:inherit}
  td input:focus, td textarea:focus, td select:focus{border-color:var(--brass);outline:none}
  td textarea{resize:vertical;min-height:32px}
  .col-narrow input{width:64px}
  .col-check{text-align:center;width:36px}
  .col-check input{width:auto}
  .col-pages{text-align:center;width:56px;white-space:nowrap}
  .col-pages label{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--muted);margin-right:4px}
  .col-pages input{width:auto}
  .cover-cell{width:120px}
  .cover-thumb{width:48px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--line);
    display:block;margin-bottom:4px;background:var(--panel-2)}
  .links-list{display:flex;flex-direction:column;gap:3px;margin-bottom:4px;min-width:220px}
  .link-row{display:flex;gap:3px}
  .link-row input{font-size:11px}
  .link-row input.label{width:38%}
  .link-row input.url{flex:1}
  tr.new-row{background:rgba(194,168,120,.06)}
  tr.dragging{opacity:.35}
  .artist-block.dragging{opacity:.35}
  .rowid{color:var(--muted);font-size:10px;white-space:nowrap}
  footer{padding:16px;display:flex;gap:10px;align-items:center}
  .hint{color:var(--muted);font-size:11px;margin-top:2px}
  .upload-input{display:none}

  .drag-col{width:22px;text-align:center}
  .drag-handle{cursor:grab;color:var(--muted);font-size:14px;user-select:none;touch-action:none}
  .drag-handle:hover{color:var(--brass)}
  .drag-disabled .drag-handle{visibility:hidden}

  /* No overflow:hidden here: it would look nicer clipping the table's
     square corners to this box's rounded border, but overflow other than
     "visible" turns a plain non-scrolling box into a sticky-positioning
     containing block too — which broke both the horizontal scroll (the
     table's true width got clipped away instead of reaching .wrap's own
     overflow-x:auto) and the sticky column header (its "stuck" offset was
     computed against this box instead of the real page scroll, dropping
     it down into the first data row). */
  .artist-block{margin-bottom:14px;border:1px solid var(--line);border-radius:6px}
  .artist-block-header{display:flex;align-items:center;gap:8px;background:var(--panel);
    padding:6px 10px;font-size:12px}
  .artist-block-header .drag-handle{font-size:16px}
  .artist-block-header .ab-name{font-weight:700}
  .artist-block-header .ab-count{color:var(--muted)}
  .filter-active-note{color:var(--muted);font-size:11px;margin:0 16px 8px}

  .thumb-preview{width:32px;height:32px;object-fit:cover;border-radius:3px;border:1px solid var(--line);
    display:inline-block;vertical-align:middle;background:var(--panel-2)}
  tr.no-match td{background:rgba(224,133,133,.06)}
  .add-artist-row{display:flex;gap:8px;align-items:center;padding:10px 16px}

  /* Comments tab */
  .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:8px;
    background:var(--brass);color:var(--ink);font-size:10px;font-weight:700;line-height:16px;text-align:center}
  .badge:empty{display:none}
  .c-section{font-size:13px;font-weight:700;margin:18px 0 8px}
  .c-table{min-width:760px;table-layout:auto}
  .c-table td{vertical-align:middle}
  .c-when{white-space:nowrap;color:var(--muted);font-size:11px}
  .c-song{white-space:nowrap}
  .c-name{font-weight:700;white-space:nowrap}
  .c-text{min-width:280px;max-width:520px;font-size:13px;line-height:1.4}
  .c-actions{white-space:nowrap}
  .c-actions button{margin-right:4px}

  /* Submissions tab */
  .s-mail{font-size:12px;margin:0 0 12px;max-width:860px;line-height:1.5}
  .s-mail.ok{color:var(--good)}
  .s-mail.warn{color:var(--bad);border:1px solid rgba(224,133,133,.3);background:rgba(224,133,133,.08);border-radius:4px;padding:8px 10px}
  .s-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 12px;max-width:860px}
  .s-card.unread{border-color:var(--brass)}
  .s-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
  .s-role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid var(--brass);color:var(--brass);white-space:nowrap}
  .s-name{font-weight:700;font-size:14px}
  .s-when{color:var(--muted);font-size:11px;white-space:nowrap}
  .s-new{background:var(--brass);color:var(--ink);font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}
  .s-actions{margin-left:auto;display:flex;gap:6px}
  .s-contact{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
  .s-contact a,.s-link a{color:var(--brass);word-break:break-all}
  .s-label{color:var(--muted);font-size:11px;margin:12px 0 4px}
  .s-text{white-space:pre-wrap;font-size:14px;line-height:1.8;background:var(--panel-2);border-radius:4px;padding:8px 11px;max-height:340px;overflow:auto}
  .s-files{display:flex;flex-direction:column;gap:10px}
  .s-file{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12px}
  .s-file .fname{word-break:break-all}
  .s-file .fsize{color:var(--muted)}
  .s-file audio{height:36px;width:420px;max-width:100%}
  .s-file img{max-width:240px;max-height:240px;border-radius:4px;border:1px solid var(--line);display:block}

  /* New Release tab */
  .nr-intro{color:var(--muted);font-size:12px;margin:0 0 12px;max-width:760px;line-height:1.5}
  .nr-top{display:flex;gap:10px;align-items:center;margin:0 0 12px}
  .nr-table{min-width:760px;table-layout:auto}
  .nr-table td{vertical-align:middle}
  .nr-num{color:var(--muted);font-size:11px;text-align:center;width:28px}
  .nr-thumb{width:40px;height:71px;object-fit:cover;border-radius:3px;border:1px solid var(--line);
    background:#000;display:block}
  .nr-thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
  .nr-video{min-width:300px}
  .nr-video .or{color:var(--muted);font-size:11px;margin:0 6px}
  .nr-video input.bad{border-color:var(--bad)}
  .nr-file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .nr-file .fname{color:var(--good);font-size:12px;word-break:break-all}
  .nr-progress{display:flex;align-items:center;gap:8px;min-width:240px}
  .nr-progress .track{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
  .nr-progress .bar{height:100%;width:0;background:var(--brass);transition:width .2s}
  .nr-progress .pct{font-size:11px;color:var(--brass);min-width:34px;text-align:right}

  /* Lyrics tab */
  .lyr-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:0 0 12px;font-size:12px}
  .lyr-top label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .lyr-table{min-width:0;table-layout:fixed;width:100%;max-width:1600px}
  .lyr-table td{vertical-align:top}
  .lyr-song{width:210px;overflow-wrap:anywhere}
  .lyr-title{font-weight:700;font-size:13px;line-height:1.4}
  .lyr-sub{color:var(--muted);font-size:11px;line-height:1.5;margin-top:2px}
  .lyr-badge{display:inline-block;font-size:10px;padding:0 5px;border:1px solid var(--line);border-radius:3px;margin-inline-start:6px;color:var(--muted)}
  .lyr-status{margin-top:8px;font-size:11px;color:var(--muted)}
  .lyr-status.has{color:var(--good)}
  .lyr-links{margin-top:6px;font-size:11px;display:flex;gap:10px}
  .lyr-links a{color:var(--brass)}
  .lyr-editor{direction:rtl;font-family:var(--fa)}
  .lyr-editor summary{cursor:pointer;color:var(--brass);padding:4px 0 10px}
  .lyr-tools,.lyr-settings{display:flex;flex-wrap:wrap;align-items:end;gap:8px;margin:12px 0}
  .lyr-tools button{font-family:var(--fa);font-size:12px;padding:6px 9px}
  .lyr-settings label,.lyr-tools label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .lyr-settings select,.lyr-settings input{max-width:100%;font:inherit;color:var(--text)}
  .lyr-settings input[type=number]{width:90px;direction:ltr}
  .lyr-settings .lyr-poet-field{flex:1;min-width:180px}
  .lyr-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .lyr-columns h3{font-size:13px;color:var(--muted);margin:8px 0}
  textarea.lyr-input{display:block;width:100%;min-height:340px;resize:vertical;font-family:var(--fa);font-size:16px;line-height:1.9;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:14px}
  textarea.lyr-input:focus{border-color:var(--brass);outline:none}
  textarea.lyr-input.filled{border-color:rgba(127,191,127,.45)}
  .lyr-preview{min-width:0;direction:ltr}
  .lyr-preview-heading{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;direction:rtl}
  .lyr-preview-poet{color:var(--brass);font-size:14px;margin:8px 0}
  .lyr-empty{color:var(--muted);font-size:13px;direction:rtl}
  .lyr-help{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}
  @media(max-width:1150px){.lyr-columns{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:700px){.lyr-table,.lyr-table tbody,.lyr-table tr,.lyr-table td{display:block;width:100%;min-width:0}.lyr-table tr{border-bottom:1px solid var(--line)}.lyr-table td{border:0}.lyr-settings input[type=number]{width:80px}}
  .col-lyrics{white-space:nowrap}

  /* Gallery tab */
  .gal-table{min-width:760px;table-layout:auto}
  .gal-table td{vertical-align:middle}
  .gal-thumb{height:96px;width:auto;max-width:180px;object-fit:cover;border-radius:3px;border:1px solid var(--line);
    background:var(--panel-2);display:block}
  .gal-table td.gal-cap{min-width:240px}
  .gal-new{font-size:10px;color:var(--brass);margin-top:4px}
  .gal-status{color:var(--brass);font-size:12px}
  .gal-table td.gal-people{min-width:260px}
  .gal-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
  .gal-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:10px;
    border:1px solid var(--brass);color:var(--brass);font-size:12px;white-space:nowrap}
  .gal-chip.nolink{border-style:dashed;border-color:var(--muted);color:var(--text)}
  .gal-chip button{border:0;background:transparent;color:inherit;padding:0 4px;font-size:13px;line-height:1}
</style>
</head>
<body>
<header>
  <h1>Site admin</h1>
  <div class="tabs" id="tabs">
    <button type="button" class="tab-btn" data-tab="credits">Credits</button>
    <button type="button" class="tab-btn" data-tab="releases">Releases</button>
    <button type="button" class="tab-btn" data-tab="lyrics">Lyrics</button>
    <button type="button" class="tab-btn" data-tab="homepage">Homepage</button>
    <button type="button" class="tab-btn" data-tab="newrelease">New Release</button>
    <button type="button" class="tab-btn" data-tab="gallery">Gallery</button>
    <button type="button" class="tab-btn" data-tab="comments">Comments<span id="commentsBadge" class="badge"></span></button>
    <button type="button" class="tab-btn" data-tab="submissions">Submissions<span id="subsBadge" class="badge"></span></button>
  </div>
  <input type="search" id="filter" placeholder="Filter by artist or title…" style="width:220px">
  <span class="spacer"></span>
  <span id="dirtyFlag" class="hint" style="display:none">Unsaved changes</span>
  <button type="button" id="exportCsvBtn" class="small" title="Download every field of every credit, as currently shown, as a CSV file">Export CSV</button>
  <button type="button" id="exportJsonBtn" class="small" title="Download every field of every credit, as currently shown, as a JSON file">Export JSON</button>
  <a class="hdr-link" href="https://github.com/merajmusic-hash/merajmirzaei-site/releases/tag/site-backups" target="_blank" rel="noopener noreferrer" title="Public site data backups. Use Export JSON or CSV for a complete backup including private notes.">Public backups</a>
  <button id="saveBtn" class="primary">Save</button>
  <form method="POST" action="/admin/logout"><button type="submit">Log out</button></form>
</header>
<div id="msg"></div>
<div id="filterNote" class="filter-active-note" style="display:none">Reordering is disabled while a filter is active — clear the filter to drag rows.</div>
<div class="wrap" id="wrap"></div>
<footer>
  <button id="addRowBtn">+ Add row</button>
  <button id="saveBtn2" class="primary">Save</button>
</footer>

<script type="module">
import * as LyricsFormat from "/lyrics-format.mjs";
var lyricsStyle = document.createElement("style");
lyricsStyle.textContent = LyricsFormat.TEXT_CSS;
document.head.appendChild(lyricsStyle);
(function(){
  var RELEASE_TYPES = ['single', 'album track', 'album'];
  var STATUS_VALUES = ['not started', 'pending', 'done'];

  var state = {
    entries: [], entriesSha: null, entriesDirty: false,
    saving: false, coverUploads: 0,
    homepage: [], homepageSha: null, homepageDirty: false,
    newReleases: [], newReleasesSha: null, newReleasesDirty: false,
    gallery: [], gallerySha: null, galleryDirty: false, galUpload: null,
    lyrics: {}, lyricsMeta: {}, lyricsUndo: {}, lyricsSaved: {}, lyricsSha: null, lyricsDirty: false, lyricsLoaded: false, lyricsError: null,
    lyricsOnlyEmpty: false, lyricsFocus: null,
    comments: { pending: [], approved: [], loaded: false, error: null },
    subs: { list: [], loaded: false, loading: false, next: null, total: 0, error: null, mail: null, emailConfigured: false },
    tab: /^#submissions$/.test(location.hash) ? 'submissions' : 'credits',
  };
  window.__adminState = state; // testability hook only; not a security boundary

  var wrap = document.getElementById('wrap');
  var msgEl = document.getElementById('msg');
  var filterEl = document.getElementById('filter');
  var filterNote = document.getElementById('filterNote');
  var dirtyFlag = document.getElementById('dirtyFlag');
  var tabsEl = document.getElementById('tabs');
  var addRowBtn = document.getElementById('addRowBtn');
  var headerEl = document.querySelector('header');

  // --header-h tracks the real page <header> height (it wraps onto more
  // lines on a narrow viewport). The column headers no longer depend on it
  // — they stick inside the scrolling .wrap — but it's kept up to date for
  // anything else that needs the header's height.
  function syncHeaderHeight(){
    document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
  }
  syncHeaderHeight();
  window.addEventListener('resize', syncHeaderHeight);
  if(window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(headerEl);

  function showMsg(text, kind){
    msgEl.innerHTML = '';
    if(!text) return;
    var div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;
    msgEl.appendChild(div);
  }

  function setDirty(){
    var v = state.entriesDirty || state.homepageDirty || state.newReleasesDirty || state.galleryDirty || state.lyricsDirty;
    dirtyFlag.style.display = v ? '' : 'none';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function opt(value, current, label){
    return '<option value="'+esc(value)+'"'+(value===current?' selected':'')+'>'+esc(label||value)+'</option>';
  }

  function entryById(id){
    for(var i=0;i<state.entries.length;i++){ if(state.entries[i].id === id) return state.entries[i]; }
    return null;
  }

  function nextOrder(list){
    var max = -1;
    (list||[]).forEach(function(e){ if(typeof e.order === 'number' && e.order > max) max = e.order; });
    return max + 1;
  }

  function blankEntry(pages){
    return {
      id: 'new-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
      order: nextOrder(state.entries),
      pages: pages.slice(),
      artist_en:'', artist_fa:'', title_en:'', title_fa:'',
      release_type:'single', album_name:'', year:'', label:'',
      role_arrangement:false, role_production:false, role_mix:false, role_mastering:false,
      links: [], start_seconds:'', cover_url:'',
      status_musicbrainz:'not started', status_discogs:'not started', status_genius:'not started',
      notes:''
    };
  }

  function hasPage(entry, name){
    return Array.isArray(entry.pages) && entry.pages.indexOf(name) !== -1;
  }
  function setPage(entry, name, on){
    var pages = Array.isArray(entry.pages) ? entry.pages.slice() : [];
    var i = pages.indexOf(name);
    if(on && i === -1) pages.push(name);
    if(!on && i !== -1) pages.splice(i, 1);
    entry.pages = pages;
  }

  // ---------------------------------------------------------------------
  // shared entry-row rendering (Credits + Releases tabs)
  // ---------------------------------------------------------------------

  function renderLinks(entry){
    var html = '<div class="links-list">';
    (entry.links||[]).forEach(function(l, li){
      html += '<div class="link-row">'
        + '<input class="label" type="text" placeholder="Label" value="'+esc(l.label)+'" data-id="'+esc(entry.id)+'" data-li="'+li+'" data-field="link-label">'
        + '<input class="url" type="text" placeholder="https://…" value="'+esc(l.url)+'" data-id="'+esc(entry.id)+'" data-li="'+li+'" data-field="link-url">'
        + '<button type="button" class="small danger" data-id="'+esc(entry.id)+'" data-li="'+li+'" data-action="remove-link">×</button>'
        + '</div>';
    });
    html += '</div><button type="button" class="small" data-id="'+esc(entry.id)+'" data-action="add-link">+ link</button>';
    return html;
  }

  // A freshly uploaded image is committed to the repo straight away, but it
  // only exists on the live site once Cloudflare has redeployed (about a
  // minute). Until then its /images/covers/... path 404s — so the thumbnail
  // shows the file just picked (entry._coverPreview), and any thumbnail
  // that fails to load is retried for a couple of minutes before being
  // shown as broken.
  window.__retryThumb = function(img){
    var n = Number(img.getAttribute('data-retry') || 0);
    var base = img.getAttribute('data-src');
    if(!base || n >= 8 || !/^\/images\//.test(base)){ img.style.opacity = 0.2; return; }
    img.setAttribute('data-retry', String(n + 1));
    img.style.opacity = 0.35;
    setTimeout(function(){ img.src = base + '?r=' + Date.now(); }, 15000);
  };

  function renderCover(entry){
    var src = entry._coverPreview || entry.cover_url;
    var thumb = src
      ? '<img class="cover-thumb" src="'+esc(src)+'" data-src="'+esc(entry.cover_url)+'" onload="this.style.opacity=1" onerror="__retryThumb(this)">'
      : '<div class="cover-thumb"></div>';
    if(entry._coverPreview) thumb += '<div class="hint">New image \u2014 on the site about a minute after Save</div>';
    return thumb
      + '<input type="text" placeholder="Image URL or path" value="'+esc(entry.cover_url)+'" data-id="'+esc(entry.id)+'" data-field="cover_url">'
      + '<button type="button" class="small" data-id="'+esc(entry.id)+'" data-action="upload-cover">Upload…</button>'
      + '<input type="file" class="upload-input" accept="image/jpeg,image/png,image/webp" data-id="'+esc(entry.id)+'">';
  }

  function renderEntryRow(entry){
    var tr = document.createElement('tr');
    tr.setAttribute('data-id', entry.id);
    tr.className = String(entry.id||'').indexOf('new-') === 0 ? 'new-row' : '';
    tr.innerHTML =
      '<td class="drag-col"><span class="drag-handle" draggable="true" data-role="track" title="Drag to reorder">⠿</span></td>'
      + '<td class="rowid">'+esc(entry.id)+'</td>'
      + '<td class="col-pages">'
        + '<label title="Show on Credits page"><input type="checkbox" '+(hasPage(entry,'credits')?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="page-credits">C</label>'
        + '<label title="Show on Releases page"><input type="checkbox" '+(hasPage(entry,'releases')?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="page-releases">R</label>'
      + '</td>'
      + '<td class="col-frozen artist-en"><input type="text" value="'+esc(entry.artist_en)+'" data-id="'+esc(entry.id)+'" data-field="artist_en"></td>'
      + '<td class="col-frozen title-en"><input type="text" value="'+esc(entry.title_en)+'" data-id="'+esc(entry.id)+'" data-field="title_en"></td>'
      + '<td><input type="text" value="'+esc(entry.artist_fa)+'" data-id="'+esc(entry.id)+'" data-field="artist_fa" dir="rtl"></td>'
      + '<td><input type="text" value="'+esc(entry.title_fa)+'" data-id="'+esc(entry.id)+'" data-field="title_fa" dir="rtl"></td>'
      + '<td><select data-id="'+esc(entry.id)+'" data-field="release_type">'
        + RELEASE_TYPES.map(function(t){ return opt(t, entry.release_type); }).join('')
        + '</select></td>'
      + '<td><input type="text" value="'+esc(entry.album_name)+'" data-id="'+esc(entry.id)+'" data-field="album_name"></td>'
      + '<td class="col-narrow"><input type="text" value="'+esc(entry.year)+'" data-id="'+esc(entry.id)+'" data-field="year"></td>'
      + '<td><input type="text" value="'+esc(entry.label)+'" data-id="'+esc(entry.id)+'" data-field="label"></td>'
      + '<td class="col-check"><input type="checkbox" '+(entry.role_arrangement?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="role_arrangement"></td>'
      + '<td class="col-check"><input type="checkbox" '+(entry.role_production?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="role_production"></td>'
      + '<td class="col-check"><input type="checkbox" '+(entry.role_mix?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="role_mix"></td>'
      + '<td class="col-check"><input type="checkbox" '+(entry.role_mastering?'checked':'')+' data-id="'+esc(entry.id)+'" data-field="role_mastering"></td>'
      + '<td>'+renderLinks(entry)+'</td>'
      + '<td class="col-narrow"><input type="text" placeholder="s" value="'+esc(entry.start_seconds)+'" data-id="'+esc(entry.id)+'" data-field="start_seconds"></td>'
      + '<td class="cover-cell">'+renderCover(entry)+'</td>'
      + '<td><select data-id="'+esc(entry.id)+'" data-field="status_musicbrainz">'
        + STATUS_VALUES.map(function(v){ return opt(v, entry.status_musicbrainz); }).join('') + '</select></td>'
      + '<td><select data-id="'+esc(entry.id)+'" data-field="status_discogs">'
        + STATUS_VALUES.map(function(v){ return opt(v, entry.status_discogs); }).join('') + '</select></td>'
      + '<td><select data-id="'+esc(entry.id)+'" data-field="status_genius">'
        + STATUS_VALUES.map(function(v){ return opt(v, entry.status_genius); }).join('') + '</select></td>'
      + '<td><textarea data-id="'+esc(entry.id)+'" data-field="notes">'+esc(entry.notes)+'</textarea></td>'
      + '<td class="col-lyrics">'+lyricsCellHtml(entry)+'</td>'
      + '<td><button type="button" class="small danger" data-id="'+esc(entry.id)+'" data-action="delete-row">Delete</button></td>';
    return tr;
  }

  // Column order/widths are shared between the header row and every data
  // row (renderEntryRow), and drive the colgroup below — table-layout:fixed
  // needs fixed pixel widths to make the sticky-left offsets in the CSS
  // (.col-pages, .col-frozen.artist-en/.title-en) land on real column
  // boundaries instead of drifting with content-based auto sizing.
  var COLUMN_WIDTHS = [
    22,  140, 56,  120, 120, 120, 120, 110, 120, 64, 100,
    40,  40,  40,  46,
    260, 64,  150,
    120, 120, 120, 170, 96, 80,
  ];

  function entryColgroup(){
    return '<colgroup>' + COLUMN_WIDTHS.map(function(w){ return '<col style="width:'+w+'px">'; }).join('') + '</colgroup>';
  }

  function entryHeaderCells(){
    return '<th></th><th>ID</th><th class="col-pages">Pages</th>'
      + '<th class="col-frozen artist-en">Artist (EN)</th><th class="col-frozen title-en">Title (EN)</th>'
      + '<th>Artist (FA)</th><th>Title (FA)</th><th>Release type</th><th>Album</th>'
      + '<th class="col-narrow">Year</th><th>Label</th>'
      + '<th class="col-check">Arr.</th><th class="col-check">Prod.</th><th class="col-check">Mix</th><th class="col-check">Master</th>'
      + '<th>Links</th><th class="col-narrow">Start (s)</th><th>Cover</th>'
      + '<th>MusicBrainz</th><th>Discogs</th><th>Genius</th><th>Notes</th><th>Lyrics</th><th></th>';
  }

  function matchesFilter(entry, q){
    if(!q) return true;
    var hay = [entry.artist_en, entry.artist_fa, entry.title_en, entry.title_fa].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  // ---------------------------------------------------------------------
  // Credits tab: grouped by artist_en, two-level drag & drop (artist
  // blocks reorder relative to each other; tracks reorder within their
  // own artist's block). Both levels are read back from one DOM walk, in
  // recomputeCreditsOrder(), because block position IS group order and a
  // track's position within its own block IS track order — the live
  // credits page derives exactly this from entry.order (see
  // renderCreditsGrouped in credits-render.js).
  // ---------------------------------------------------------------------

  function renderCreditsTab(){
    var q = (filterEl.value||'').trim().toLowerCase();
    var filtering = !!q;
    filterNote.style.display = filtering ? '' : 'none';

    var visible = state.entries.filter(function(e){ return hasPage(e, 'credits'); }).sort(byOrder);
    var order = [], byArtist = {};
    visible.forEach(function(e){
      var key = (e.artist_en || '').trim() || '(no artist)';
      if(!byArtist[key]){ byArtist[key] = []; order.push(key); }
      byArtist[key].push(e);
    });

    wrap.innerHTML = '';
    var container = document.createElement('div');
    container.id = 'creditsGroups';
    order.forEach(function(name){
      var members = byArtist[name];
      var shown = members.filter(function(e){ return matchesFilter(e, q); });
      if(filtering && shown.length === 0) return;

      var block = document.createElement('div');
      block.className = 'artist-block' + (filtering ? ' drag-disabled' : '');
      block.setAttribute('data-artist', name);

      var header = document.createElement('div');
      header.className = 'artist-block-header';
      header.innerHTML = '<span class="drag-handle" draggable="true" data-role="group" title="Drag to reorder this artist">⠿</span>'
        + '<span class="ab-name">'+esc(name)+'</span>'
        + '<span class="ab-count">('+members.length+(members.length===1?' track':' tracks')+')</span>';
      block.appendChild(header);

      var table = document.createElement('table');
      table.innerHTML = entryColgroup() + '<thead><tr>'+entryHeaderCells()+'</tr></thead>';
      var tbody = document.createElement('tbody');
      tbody.className = 'track-rows';
      (filtering ? shown : members).forEach(function(e){ tbody.appendChild(renderEntryRow(e)); });
      table.appendChild(tbody);
      block.appendChild(table);

      container.appendChild(block);
    });
    wrap.appendChild(container);

    if(!filtering){
      attachTrackDnD(container);
      attachGroupDnD(container);
    }
  }

  function recomputeCreditsOrder(){
    var n = 0;
    document.querySelectorAll('#creditsGroups .artist-block').forEach(function(block){
      block.querySelectorAll('.track-rows > tr').forEach(function(tr){
        var entry = entryById(tr.getAttribute('data-id'));
        if(entry) entry.order = n++;
      });
    });
    state.entriesDirty = true;
    setDirty();
  }

  // ---------------------------------------------------------------------
  // Releases tab: flat sortable table, filtered to pages including
  // 'releases' (no artist grouping — the live releases page is a flat
  // grid, not an accordion).
  // ---------------------------------------------------------------------

  function renderReleasesTab(){
    var q = (filterEl.value||'').trim().toLowerCase();
    var filtering = !!q;
    filterNote.style.display = filtering ? '' : 'none';

    var visible = state.entries.filter(function(e){ return hasPage(e, 'releases'); }).sort(byOrder);
    if(filtering) visible = visible.filter(function(e){ return matchesFilter(e, q); });

    wrap.innerHTML = '';
    var table = document.createElement('table');
    table.innerHTML = entryColgroup() + '<thead><tr>'+entryHeaderCells()+'</tr></thead>';
    var tbody = document.createElement('tbody');
    tbody.id = 'releasesRows';
    tbody.className = filtering ? 'drag-disabled' : '';
    visible.forEach(function(e){ tbody.appendChild(renderEntryRow(e)); });
    table.appendChild(tbody);
    wrap.appendChild(table);

    if(!filtering) attachFlatDnD(tbody, recomputeReleasesOrder);
  }

  function recomputeReleasesOrder(){
    var n = 0;
    document.querySelectorAll('#releasesRows > tr').forEach(function(tr){
      var entry = entryById(tr.getAttribute('data-id'));
      if(entry) entry.order = n++;
    });
    state.entriesDirty = true;
    setDirty();
  }

  // ---------------------------------------------------------------------
  // Homepage tab: flat sortable table of {artist_en, order} rows from
  // data/homepage.json — a separate file, since a homepage tile is a
  // property of the ARTIST, not of any one track/credit entry. Each row
  // is cross-checked against state.entries so a name with no matching
  // credits (which would silently render nothing on the live page) is
  // flagged rather than failing invisibly.
  // ---------------------------------------------------------------------

  function creditedArtistNames(){
    var seen = {}, names = [];
    state.entries.forEach(function(e){
      var name = (e.artist_en||'').trim();
      if(name && !seen[name]){ seen[name] = true; names.push(name); }
    });
    names.sort(function(a,b){ return a.localeCompare(b); });
    return names;
  }

  function artistPreview(name){
    for(var i=0;i<state.entries.length;i++){
      var e = state.entries[i];
      if((e.artist_en||'').trim() !== name) continue;
      var img = e.artist_image || e.cover_url;
      if(img) return img;
    }
    return '';
  }

  function renderHomepageTab(){
    var q = (filterEl.value||'').trim().toLowerCase();
    var filtering = !!q;
    filterNote.style.display = filtering ? '' : 'none';

    var visible = state.homepage.slice().sort(byOrder);
    if(filtering) visible = visible.filter(function(h){ return (h.artist_en||'').toLowerCase().indexOf(q) !== -1; });

    wrap.innerHTML = '';
    var table = document.createElement('table');
    table.className = 'homepage-table';
    table.innerHTML = '<thead><tr><th></th><th>Photo</th><th>Artist (EN)</th><th></th></tr></thead>';
    var tbody = document.createElement('tbody');
    tbody.id = 'homepageRows';
    tbody.className = filtering ? 'drag-disabled' : '';
    visible.forEach(function(h){
      var tr = document.createElement('tr');
      tr.setAttribute('data-oid', h._oid);
      var img = artistPreview(h.artist_en);
      var matched = !!img || state.entries.some(function(e){ return (e.artist_en||'').trim() === (h.artist_en||'').trim(); });
      if(!matched) tr.className = 'no-match';
      tr.innerHTML =
        '<td class="drag-col"><span class="drag-handle" draggable="true" data-role="homepage" title="Drag to reorder">⠿</span></td>'
        + '<td>'+(img ? '<img class="thumb-preview" src="'+esc(img)+'" onerror="this.style.opacity=0.2">' : '<span class="hint">no photo</span>')+'</td>'
        + '<td><input type="text" value="'+esc(h.artist_en)+'" data-oid="'+esc(h._oid)+'" data-field="artist_en"'
          + (matched ? '' : ' title="No matching credits entry — this tile won\'t appear on the live homepage">')+'</td>'
        + '<td><button type="button" class="small danger" data-oid="'+esc(h._oid)+'" data-action="delete-homepage-row">Remove</button></td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    var addRow = document.createElement('div');
    addRow.className = 'add-artist-row';
    var already = {};
    state.homepage.forEach(function(h){ already[(h.artist_en||'').trim()] = true; });
    var candidates = creditedArtistNames().filter(function(n){ return !already[n]; });
    addRow.innerHTML = '<select id="homepageAddSelect">'
      + '<option value="">Choose an artist to add…</option>'
      + candidates.map(function(n){ return opt(n, ''); }).join('')
      + '</select>'
      + '<button type="button" id="homepageAddBtn" class="small">+ Add to homepage</button>';
    wrap.appendChild(addRow);
    document.getElementById('homepageAddBtn').addEventListener('click', function(){
      var sel = document.getElementById('homepageAddSelect');
      var name = sel.value;
      if(!name) return;
      state.homepage.push({ _oid: homepageOid(), artist_en: name, order: nextOrder(state.homepage) });
      state.homepageDirty = true;
      setDirty();
      render();
    });

    if(!filtering) attachFlatDnD(tbody, recomputeHomepageOrder);
  }

  function recomputeHomepageOrder(){
    var n = 0;
    document.querySelectorAll('#homepageRows > tr').forEach(function(tr){
      var oid = tr.getAttribute('data-oid');
      var h = state.homepage.filter(function(x){ return String(x._oid) === oid; })[0];
      if(h) h.order = n++;
    });
    state.homepageDirty = true;
    setDirty();
  }

  var homepageOidCounter = 0;
  function homepageOid(){ return 'h' + (++homepageOidCounter); }

  // ---------------------------------------------------------------------
  // Lyrics tab — data/lyrics.json: one pasted text per song. A song that has
  // lyrics gets its own public Lyrics page (and a "Lyrics" button on its
  // page); a song left empty gets nothing. Keyed by the song's id, kept in
  // its own file and saved with the same Save button as everything else.
  // ---------------------------------------------------------------------

  function lyricsHas(id){ return !!LyricsFormat.cleanText(state.lyrics[id] || ''); }
  function lyricsMetaFor(id){
    var meta = state.lyricsMeta[id] || {};
    return { poet:typeof meta.poet === 'string' ? meta.poet : '', layout:LyricsFormat.normalizeLayout(meta.layout) };
  }
  function lyricsHasDetails(id){
    var meta = lyricsMetaFor(id);
    return !!meta.poet.trim() || JSON.stringify(meta.layout) !== JSON.stringify(LyricsFormat.DEFAULT_LAYOUT);
  }
  function lyricsLineCount(id){
    return LyricsFormat.cleanText(state.lyrics[id] || '').split('\n').filter(Boolean).length;
  }
  function updateLyricsRow(id, row){
    if(!row) return;
    var text = state.lyrics[id] || '', meta = lyricsMetaFor(id), lang = LyricsFormat.textLang(text);
    var status = row.querySelector('.lyr-status');
    status.textContent = lyricsStatusHtml(id); status.classList.toggle('has', lyricsHas(id));
    row.querySelector('textarea[data-lyr]').classList.toggle('filled', lyricsHas(id));
    var preview = row.querySelector('.lyr-text');
    preview.innerHTML = LyricsFormat.renderHtml(text);
    preview.setAttribute('style', LyricsFormat.layoutStyle(meta.layout));
    preview.setAttribute('lang', lang); preview.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
    row.querySelector('.lyr-empty').hidden = lyricsHas(id);
    var poet = row.querySelector('.lyr-preview-poet');
    poet.hidden = !meta.poet.trim(); poet.querySelector('bdi').textContent = meta.poet.trim();
    var undo = row.querySelector('[data-format="undo"]');
    undo.disabled = !(state.lyricsUndo[id] || []).length;
    updateLyricsCount();
  }
  function lyricsControlInput(t, committed){
    var id = t.getAttribute('data-lyr-meta');
    if(id == null) id = t.getAttribute('data-lyr-layout');
    if(id == null) return false;
    var meta = lyricsMetaFor(id), field = t.getAttribute('data-layout-field');
    if(field){
      if(t.type === 'number'){
        if(!committed && (t.value === '' || !t.validity.valid)) return true;
        meta.layout[field] = t.value === '' ? LyricsFormat.DEFAULT_LAYOUT[field] : Number(t.value);
      } else meta.layout[field] = t.value;
      meta.layout = LyricsFormat.normalizeLayout(meta.layout);
      if(committed) t.value = meta.layout[field];
    } else meta.poet = t.value;
    state.lyricsMeta[id] = meta; state.lyricsDirty = true; setDirty();
    updateLyricsRow(id, t.closest('tr'));
    return true;
  }
  function lyricsFormatAction(button){
    var id = button.getAttribute('data-id'), action = button.getAttribute('data-format'), row = button.closest('tr');
    var ta = row.querySelector('textarea[data-lyr]'), before = state.lyrics[id] || '', after;
    var history = state.lyricsUndo[id] || (state.lyricsUndo[id] = []);
    if(action === 'reset'){
      var meta = lyricsMetaFor(id); meta.layout = LyricsFormat.normalizeLayout(); state.lyricsMeta[id] = meta;
      row.querySelectorAll('[data-lyr-layout]').forEach(function(el){ el.value = meta.layout[el.getAttribute('data-layout-field')]; });
      state.lyricsDirty = true; setDirty(); updateLyricsRow(id, row); return;
    }
    if(action === 'undo'){ if(!history.length) return; after = history.pop(); }
    else if(action === 'line' || action === 'stanza'){
      var at = ta.selectionEnd; after = before.slice(0,at) + (action === 'line' ? '\n' : '\n\n') + before.slice(at);
    } else after = LyricsFormat.formatText(before, action, row.querySelector('[data-lyr-words]').value);
    if(after === before) return;
    if(action !== 'undo'){ history.push(before); if(history.length > 10) history.shift(); }
    state.lyrics[id] = after; ta.value = after; state.lyricsDirty = true; setDirty(); updateLyricsRow(id,row);
    ta.focus();
    if(action === 'line' || action === 'stanza') ta.setSelectionRange(at + (action === 'line' ? 1 : 2), at + (action === 'line' ? 1 : 2));
  }

  function slugifyId(id){
    return String(id || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function lyricsSongs(){
    return state.entries.filter(function(e){
      return (e.title_en || e.title_fa) && (hasPage(e, 'credits') || hasPage(e, 'releases'));
    }).sort(function(a, b){
      var A = (a.artist_en || '').toLowerCase(), B = (b.artist_en || '').toLowerCase();
      return A < B ? -1 : A > B ? 1 : byOrder(a, b);
    });
  }

  // The small button at the end of every Credits / Releases row: jumps to
  // that song's box in the Lyrics tab.
  function lyricsCellHtml(entry){
    if(!(entry.title_en || entry.title_fa)) return '<span class="hint">add a title first</span>';
    var has = lyricsHas(entry.id);
    return '<button type="button" class="small'+(has ? ' primary' : '')+'" data-action="goto-lyrics" data-id="'+esc(entry.id)+'">'
      + (has ? '✓ Lyrics' : '+ Lyrics') + '</button>';
  }

  function lyricsStatusHtml(id){
    return lyricsHas(id) ? '✓ ' + lyricsLineCount(id) + ' خط' : 'هنوز شعری ندارد';
  }

  function updateLyricsCount(){
    var el = document.getElementById('lyrCount');
    if(!el) return;
    var songs = lyricsSongs();
    var done = songs.filter(function(e){ return lyricsHas(e.id); }).length;
    el.textContent = done + ' of ' + songs.length + ' songs have lyrics';
  }

  function lyricsRowHtml(e){
    var hub = hasPage(e, 'credits') ? 'credits' : 'releases', slug = slugifyId(e.id), saved = !!state.lyricsSaved[e.id];
    var title = e.title_en || e.title_fa, titleAlt = e.title_en && e.title_fa ? e.title_fa : '';
    var artist = [e.artist_en, e.artist_fa && e.artist_fa !== e.artist_en ? e.artist_fa : ''].filter(Boolean).join(' · ');
    var id = esc(e.id), meta = lyricsMetaFor(e.id), l = meta.layout, text = state.lyrics[e.id] || '', lang = LyricsFormat.textLang(text);
    function tool(action,label,extra){ return '<button type="button" data-action="lyrics-format" data-id="'+id+'" data-format="'+action+'" '+(extra || '')+'>'+label+'</button>'; }
    function select(field,label,options){ return '<label>'+label+'<select data-lyr-layout="'+id+'" data-layout-field="'+field+'">'+options.map(function(o){ return '<option value="'+o[0]+'"'+(l[field] === o[0] ? ' selected' : '')+'>'+o[1]+'</option>'; }).join('')+'</select></label>'; }
    function number(field,label,min,max,step){ return '<label>'+label+'<input type="number" data-lyr-layout="'+id+'" data-layout-field="'+field+'" value="'+l[field]+'" min="'+min+'" max="'+max+'" step="'+step+'"></label>'; }
    return '<tr><td class="lyr-song">'
      + '<div class="lyr-title" dir="auto">'+esc(title)+'<span class="lyr-badge">'+(hub === 'credits' ? 'Credits' : 'Releases')+'</span></div>'
      + (titleAlt ? '<div class="lyr-sub" dir="auto">'+esc(titleAlt)+'</div>' : '')
      + '<div class="lyr-sub" dir="auto">'+esc(artist)+'</div><div class="lyr-status'+(lyricsHas(e.id) ? ' has' : '')+'">'+esc(lyricsStatusHtml(e.id))+'</div>'
      + (saved ? '<div class="lyr-links">Open page: <a href="/fa/'+hub+'/'+esc(slug)+'/lyrics" target="_blank" rel="noopener noreferrer">FA</a><a href="/'+hub+'/'+esc(slug)+'/lyrics" target="_blank" rel="noopener noreferrer">EN</a></div>' : '')

  // ---------------------------------------------------------------------
  // New Release tab — data/new-releases.json: the homepage video player's
  // playlist, played top to bottom. Each row's video is either a file
  // uploaded here (stored by the Worker, played natively) or a YouTube
  // link. Rows are addressed by their own id (data-nr), never by index.
  // ---------------------------------------------------------------------

  var MAX_VIDEO_BYTES = 95 * 1024 * 1024;
  var VIDEO_TYPES = {'video/mp4':1, 'video/quicktime':1, 'video/webm':1};
  var VIDEO_TYPE_BY_EXT = {mp4:'video/mp4', m4v:'video/mp4', mov:'video/quicktime', webm:'video/webm'};

  function youtubeId(url){
    var m = String(url || '').match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function nrById(id){
    for(var i=0;i<state.newReleases.length;i++){ if(state.newReleases[i].id === id) return state.newReleases[i]; }
    return null;
  }

  function nrNewId(){ return 'nr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function nrUploading(){
    return state.newReleases.some(function(it){ return it._uploading != null; });
  }

  // Songs on the Releases page — what a video (and its name) links to.
  function releaseEntries(){
    return state.entries
      .filter(function(e){ return hasPage(e, 'releases') && (e.title_en || e.title_fa); })
      .slice().sort(byOrder);
  }

  function nrSongCell(it){
    var id = esc(it.id);
    var list = releaseEntries();
    var known = list.some(function(e){ return e.id === it.release_id; });
    var html = '<select data-nr="'+id+'" data-field="release_id" style="max-width:230px">'
      + '<option value="">— choose the song —</option>';
    if(it.release_id && !known) html += '<option value="'+esc(it.release_id)+'" selected>(missing from Releases) '+esc(it.release_id)+'</option>';
    list.forEach(function(e){
      var label = (e.title_en || e.title_fa) + (e.artist_en ? ' — ' + e.artist_en : '');
      html += '<option value="'+esc(e.id)+'"'+(e.id === it.release_id ? ' selected' : '')+'>'+esc(label)+'</option>';
    });
    html += '</select>';
    if(!it.release_id) html += '<div class="hint">Not linked yet — the video won’t be clickable.</div>';
    else if(!known) html += '<div class="hint" style="color:var(--bad)">This song is no longer on the Releases page.</div>';
    return html;
  }

  function nrThumb(it){
    if(it.video_url) return '<video class="nr-thumb" src="'+esc(it.video_url)+'#t=0.5" preload="metadata" muted playsinline></video>';
    var yid = youtubeId(it.youtube_url);
    if(yid) return '<img class="nr-thumb" src="https://i.ytimg.com/vi/'+esc(yid)+'/hqdefault.jpg" alt="">';
    return '<div class="nr-thumb empty">no video</div>';

  function nrVideoCell(it){
    var id = esc(it.id);
    var fileInput = '<input type="file" class="upload-input" data-nr="'+id+'" accept="video/mp4,video/quicktime,video/webm,.mp4,.m4v,.mov,.webm">';

  function recomputeNrOrder(){
    var n = 0;
    document.querySelectorAll('#nrRows > tr').forEach(function(tr){
      var it = nrById(tr.getAttribute('data-nr-row'));
      if(it) it.order = n++;
    });
    state.newReleasesDirty = true;
    setDirty();
    render();
  }

  function nrAdd(){
    var sorted = state.newReleases.slice().sort(byOrder);
    var it = { id: nrNewId(), release_id: '', title_en: '', title_fa: '', youtube_url: '', video_url: '', order: 0 };
    state.newReleases = [it].concat(sorted);
    state.newReleases.forEach(function(x, k){ x.order = k; });
    state.newReleasesDirty = true; setDirty();
    filterEl.value = '';
    render();
    var first = wrap.querySelector('select[data-nr="'+it.id+'"][data-field="release_id"]');
    if(first) first.focus();
  }

  function nrUpdateProgress(it){
    var box = wrap.querySelector('[data-nr-progress="'+it.id+'"]');
    if(!box) return;
    box.querySelector('.bar').style.width = it._uploading + '%';
    box.querySelector('.pct').textContent = it._uploading + '%';
  }

  function nrUpload(it, file){
    var type = file.type;
    if(!VIDEO_TYPES[type]){
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      type = VIDEO_TYPE_BY_EXT[ext] || type;
    }
    if(!VIDEO_TYPES[type]){ showMsg('That file type can’t be used. Please use an MP4 (recommended), MOV or WebM video.', 'err'); return; }
    if(file.size > MAX_VIDEO_BYTES){
      showMsg('This video is ' + (file.size/1048576).toFixed(0) + ' MB — the limit is 95 MB. Export a smaller MP4 and try again.', 'err');
      return;
    }
    if(!it.title_en) it.title_en = file.name.replace(/\.[^.]+$/, '');
    it._uploading = 0;
    render();
    showMsg('Uploading video…', 'ok');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/admin/api/upload-video');
    xhr.setRequestHeader('Content-Type', type);
    xhr.setRequestHeader('X-Filename-Hint', encodeURIComponent(it.title_en || 'video'));
    xhr.upload.onprogress = function(e){
      if(!e.lengthComputable) return;
      // Hold at 99% until the server confirms it has stored the file.
      it._uploading = Math.min(99, Math.round(e.loaded / e.total * 100));
      nrUpdateProgress(it);
    };
    xhr.onload = function(){
      var j = {};
      try{ j = JSON.parse(xhr.responseText); }catch(err){}
      it._uploading = null;
      if(xhr.status >= 200 && xhr.status < 300 && j.ok){
        it.video_url = j.path;
        it.youtube_url = '';
        state.newReleasesDirty = true; setDirty();
        showMsg('Video uploaded. Press Save to put it on the site.', 'ok');
      } else {
        showMsg('Upload failed: ' + (j.error || ('server answered ' + xhr.status)), 'err');
      }
      render();
    };
    xhr.onerror = function(){
      it._uploading = null;
      showMsg('Upload failed: the connection dropped. Please try again.', 'err');
      render();
    };
    xhr.send(file);
  }

  // ---------------------------------------------------------------------
  // Gallery tab — data/gallery.json: the photos on the site's Gallery page,
  // top to bottom. Photos are shrunk in the browser before uploading (so a
  // big phone photo uploads fast and the page stays light), and nothing
  // reaches the site until Save, which puts the new photos, the list and
  // the removal of any deleted photos on the site in one go.
  // ---------------------------------------------------------------------

  var GAL_MAX_EDGE = 1600;       // px, longest side after shrinking
  var GAL_JPEG_QUALITY = 0.86;
  var GAL_MAX_SOURCE_BYTES = 40 * 1024 * 1024;

  function galById(id){
    for(var i=0;i<state.gallery.length;i++){ if(state.gallery[i].id === id) return state.gallery[i]; }
    return null;
  }

  function galNewId(){ return 'g-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // Names offered when tagging who is in a photo: Meraj himself, Miragesohi,
  // and every artist credited on the site (a tagged artist links to their
  // artist page on the Gallery page). Any other name can be typed too; it
  // is shown without a link.
  function galKnownPeople(){
    var seen = {}, list = [
      { en: 'Meraj Mirzaei', fa: 'معراج میرزایی' },
      { en: 'Miragesohi', fa: '' },
    ];
    list.forEach(function(p){ seen[p.en.toLowerCase()] = 1; });
    state.entries.forEach(function(e){
      if(!e.artist_en || !(e.title_en || e.title_fa) || !hasPage(e, 'credits')) return;
      var k = e.artist_en.trim().toLowerCase();
      if(seen[k]) return;
      seen[k] = 1;
      list.push({ en: e.artist_en.trim(), fa: (e.artist_fa || '').trim() });
    });
    return list;
  }

  // Typed text -> the site's own spelling of that name (English or Farsi
  // spelling both match), or the text as typed if it's someone new.
  function galCanonicalName(text){
    var t = String(text || '').trim();
    if(!t) return '';
    var k = t.toLowerCase();
    var known = galKnownPeople();
    for(var i=0;i<known.length;i++){
      if(known[i].en.toLowerCase() === k || (known[i].fa && known[i].fa.toLowerCase() === k)) return known[i].en;
    }
    return t;
  }

  function galIsKnown(name){
    var k = String(name).toLowerCase();
    return galKnownPeople().some(function(p){ return p.en.toLowerCase() === k; });
  }

  function galPeopleCell(it){
    var id = esc(it.id);
    var chips = (it.people || []).map(function(n, i){
      var known = galIsKnown(n);
      return '<span class="gal-chip'+(known ? '' : ' nolink')+'" title="'+(known ? 'Links to their page on the site' : 'Not on the site — shown without a link')+'">'
        + esc(n) + '<button type="button" data-action="gal-person-remove" data-gal="'+id+'" data-i="'+i+'" title="Remove">×</button></span>';
    }).join('');
    return (chips ? '<div class="gal-chips">'+chips+'</div>' : '')
      + '<input type="text" list="galPeopleList" data-gal-person="'+id+'" placeholder="+ add a name (pick or type)" style="width:100%">';
  }

  function galAddPerson(id, text){
    var it = galById(id);
    var name = galCanonicalName(text);
    if(!it || !name) return false;
    it.people = it.people || [];
    if(it.people.some(function(n){ return n.toLowerCase() === name.toLowerCase(); })) return false;
    if(it.people.length >= 12){ showMsg('A photo can have at most 12 names.', 'err'); return false; }
    it.people.push(name);
    state.galleryDirty = true; setDirty();
    render();
    var again = wrap.querySelector('input[data-gal-person="'+id+'"]');
    if(again) again.focus();
    return true;
  }

        + '<td><button type="button" class="small danger" data-gal="'+id+'" data-action="gal-delete">Remove</button></td>';
      tbody.appendChild(tr);

    table.appendChild(tbody);
    wrap.appendChild(table);
    var dl = document.createElement('datalist');
    dl.id = 'galPeopleList';
    dl.innerHTML = galKnownPeople().map(function(p){

      empty.textContent = 'No photos yet — the Gallery page is empty until you add some.';
      wrap.appendChild(empty);
    }

  // Decodes the picked file, shrinks it so its longest side is at most
  // GAL_MAX_EDGE, and re-encodes it as JPEG. Browsers apply the photo's
  // own rotation (EXIF) when drawing it, so portrait phone photos stay
  // upright.
  function prepareImage(file, maxEdge, quality, maxBytes){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h){ URL.revokeObjectURL(url); reject(new Error('“' + file.name + '” could not be read as a photo.')); return; }
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0B0D10'; // the site's background, behind any transparent parts
        ctx.fillRect(0, 0, cw, ch);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        function encode(){
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('“' + file.name + '” could not be converted.')); return; }
            if(maxBytes && blob.size > maxBytes){
              if(quality > 0.65){ quality -= 0.1; encode(); return; }
              reject(new Error('This cover is too complex to fit in 1MB. Choose a smaller image.')); return;
            }
            var reader = new FileReader();
            reader.onload = function(){ resolve({ blob: blob, base64: String(reader.result).split(',')[1] }); };
            reader.onerror = function(){ reject(new Error('“' + file.name + '” could not be read.')); };
            reader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        }
        encode();
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        var heic = /\.hei[cf]$/i.test(file.name) || /hei[cf]/i.test(file.type);
        reject(new Error(heic
          ? '“' + file.name + '” is an iPhone HEIC photo, which this browser can’t open. Upload it from Safari, or from your iPhone directly (it converts automatically).'
          : '“' + file.name + '” is not a photo this browser can open. Use JPEG, PNG or WebP.'));
      };
      img.src = url;
    });
  }

  function galUploadOne(file){
    return prepareImage(file, GAL_MAX_EDGE, GAL_JPEG_QUALITY).then(function(prep){
      return fetch('/admin/api/gallery/upload', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ filenameHint: file.name.replace(/\.[^.]+$/, ''), mime: 'image/jpeg', contentBase64: prep.base64 })
      }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(!res.ok || !res.j.ok) throw new Error('“' + file.name + '”: ' + (res.j.error || 'upload failed'));
          var preview = '';
          try{ preview = URL.createObjectURL(prep.blob); }catch(e){}
          return { id: galNewId(), src: res.j.path, people: [], caption_en: '', caption_fa: '', order: 0, _blob: res.j.blobSha, _preview: preview };
        });

  // Uploads the picked photos one after another, adding each at the top as
  // it finishes (so the first picked photo ends up first).
  function galAddFiles(files){
    files = Array.prototype.slice.call(files || []);
    if(!files.length) return;
    var tooBig = files.filter(function(f){ return f.size > GAL_MAX_SOURCE_BYTES; });
    if(tooBig.length){ showMsg('“' + tooBig[0].name + '” is over 40 MB — please pick a smaller photo.', 'err'); return; }
    state.galUpload = { done: 0, total: files.length };
    filterEl.value = '';
    showMsg('', '');
    render();
    var errors = [];
    var added = [];
    var chain = Promise.resolve();
    files.forEach(function(file){
      chain = chain.then(function(){
        return galUploadOne(file).then(function(it){ added.push(it); }, function(err){ errors.push(err.message); });
      }).then(function(){
        state.galUpload.done++;
        if(state.tab === 'gallery') render();
      });
    });
    chain.then(function(){
      state.galUpload = null;
      if(added.length){
        state.gallery = added.concat(state.gallery.slice().sort(byOrder));
        state.gallery.forEach(function(x, k){ x.order = k; });
        state.galleryDirty = true; setDirty();
      }
      if(errors.length){
        showMsg((added.length ? added.length + ' photo(s) added, but some failed — ' : 'Upload failed — ') + errors.join(' · '), 'err');
      } else {
        showMsg(added.length + (added.length === 1 ? ' photo' : ' photos') + ' added. Press Save to put ' + (added.length === 1 ? 'it' : 'them') + ' on the site.', 'ok');
      }
      render();
    });
  }

  // ---------------------------------------------------------------------
  // drag & drop — a dragged element's real DOM node is repositioned live
  // on dragover (the classic vanilla "sortable list" trick), so by drop
  // time the DOM already reflects the new order and in-progress input
  // values in other rows are never disturbed.
  // ---------------------------------------------------------------------

  var dragSrc = null;

  function rowMidpointBefore(e, el){
    var rect = el.getBoundingClientRect();
    return (e.clientY - rect.top) < rect.height / 2;
  }

  function attachFlatDnD(containerEl, onCommit){
    containerEl.addEventListener('dragstart', function(e){
      var handle = e.target.closest('.drag-handle');
      if(!handle || !containerEl.contains(handle)) return;
      dragSrc = handle.closest('tr');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      dragSrc.classList.add('dragging');
    });
    containerEl.addEventListener('dragover', function(e){
      if(!dragSrc) return;
      var tr = e.target.closest('tr');
      if(!tr || tr === dragSrc || tr.parentElement !== dragSrc.parentElement) return;
      e.preventDefault();
      var before = rowMidpointBefore(e, tr);
      tr.parentElement.insertBefore(dragSrc, before ? tr : tr.nextSibling);
    });
    containerEl.addEventListener('drop', function(e){ if(dragSrc) e.preventDefault(); });
    containerEl.addEventListener('dragend', function(){
      if(!dragSrc) return;
      dragSrc.classList.remove('dragging');
      dragSrc = null;
      onCommit();
    });
  }

  function attachTrackDnD(containerEl){
    containerEl.addEventListener('dragstart', function(e){
      var handle = e.target.closest('.drag-handle[data-role="track"]');
      if(!handle) return;
      dragSrc = handle.closest('tr');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      dragSrc.classList.add('dragging');
      e.stopPropagation();
    });
    containerEl.addEventListener('dragover', function(e){
      if(!dragSrc || dragSrc.tagName !== 'TR') return;
      var tr = e.target.closest('tr');
      if(!tr || tr === dragSrc || tr.parentElement !== dragSrc.parentElement) return;
      e.preventDefault();
      e.stopPropagation();
      var before = rowMidpointBefore(e, tr);
      tr.parentElement.insertBefore(dragSrc, before ? tr : tr.nextSibling);
    });
    containerEl.addEventListener('drop', function(e){ if(dragSrc && dragSrc.tagName === 'TR') e.preventDefault(); });
    containerEl.addEventListener('dragend', function(){
      if(!dragSrc || dragSrc.tagName !== 'TR') return;
      dragSrc.classList.remove('dragging');
      dragSrc = null;
      recomputeCreditsOrder();
    });
  }

  function attachGroupDnD(containerEl){
    containerEl.addEventListener('dragstart', function(e){
      var handle = e.target.closest('.drag-handle[data-role="group"]');
      if(!handle) return;
      dragSrc = handle.closest('.artist-block');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      dragSrc.classList.add('dragging');
    });
    containerEl.addEventListener('dragover', function(e){
      if(!dragSrc || !dragSrc.classList || !dragSrc.classList.contains('artist-block')) return;
      var block = e.target.closest('.artist-block');
      if(!block || block === dragSrc || block.parentElement !== dragSrc.parentElement) return;
      e.preventDefault();
      var before = rowMidpointBefore(e, block);
      block.parentElement.insertBefore(dragSrc, before ? block : block.nextSibling);
    });
    containerEl.addEventListener('drop', function(e){
      if(dragSrc && dragSrc.classList && dragSrc.classList.contains('artist-block')) e.preventDefault();
    });
    containerEl.addEventListener('dragend', function(){
      if(!dragSrc || !dragSrc.classList || !dragSrc.classList.contains('artist-block')) return;
      dragSrc.classList.remove('dragging');
      dragSrc = null;
      recomputeCreditsOrder();
    });
  }

  function byOrder(a, b){ return (a.order||0) - (b.order||0); }

    });
