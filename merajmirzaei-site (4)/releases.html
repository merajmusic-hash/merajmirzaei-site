<style>
:root{
  --ink:#0B0D10; --panel:#14181D; --panel-2:#1B2027; --line:#262D36;
  --brass:#C2A878; --text:#E7E4DE; --muted:#8B95A1;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Inter Tight",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --fa:"Vazirmatn",system-ui,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(194,168,120,.12)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.fa{font-family:var(--fa);direction:rtl}
body.fa .mono,body.fa .eyebrow,body.fa .kicker,body.fa .nav a,
body.fa .stat .l,body.fa .btn,body.fa .roster span,body.fa .roster a{font-family:var(--mono)}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 var(--pad)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
img{max-width:100%}

/* masthead */
.masthead{position:sticky;top:0;z-index:60;background:rgba(11,13,16,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0}
.markname{font-family:var(--display);font-weight:800;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.markname span{color:var(--brass)}
.langtog{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-decoration:none;color:var(--muted);border:1px solid var(--line);
  border-radius:2px;padding:5px 10px;white-space:nowrap}
.langtog:hover{color:var(--brass);border-color:var(--brass)}
.nav{display:flex;gap:20px;overflow-x:auto;padding:10px 0 12px;
  scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;text-decoration:none;color:var(--muted);
  white-space:nowrap;padding-bottom:4px;border-bottom:1px solid transparent}
.nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--brass)}

.rail{display:flex;align-items:center;gap:12px;margin:0 0 22px}
.rail .ticks{flex:1;height:9px;background-image:repeating-linear-gradient(
  to right,var(--line) 0 1px,transparent 1px 9px)}
.rail .peak{width:7px;height:7px;border-radius:50%;background:var(--brass);
  box-shadow:0 0 12px 1px rgba(194,168,120,.45);flex:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);margin:0;white-space:nowrap}

/* hero */
.hero{padding:44px 0 40px;border-bottom:1px solid var(--line)}
.herogrid{display:grid;grid-template-columns:1fr;gap:30px;align-items:center}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--brass);margin:0 0 18px}
.hero h1{font-family:var(--display);font-weight:900;
  font-size:clamp(38px,10.5vw,68px);line-height:.94;letter-spacing:-.02em;
  text-transform:uppercase;margin:0 0 12px}
body.fa .hero h1{font-family:var(--fa);font-weight:800;letter-spacing:0;
  text-transform:none;font-size:clamp(34px,9.5vw,60px)}
.altname{font-weight:700;font-size:clamp(20px,5.5vw,28px);line-height:1.3;
  color:var(--muted);margin:0 0 20px}
body:not(.fa) .altname{font-family:var(--fa);direction:rtl;text-align:left}
body.fa .altname{font-family:var(--display);direction:ltr;text-align:right;
  text-transform:uppercase;letter-spacing:.02em}
.hr{width:64px;height:1px;background:var(--brass);margin:0 0 20px}
.role{font-size:clamp(16px,4.2vw,18px);line-height:1.75;max-width:46ch;
  margin:0 0 26px;color:#B9B5AE}
.role b{color:var(--text);font-weight:600}
.portrait{aspect-ratio:4/5;overflow:visible;border:0;background:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;border:0;
  -webkit-mask-image:radial-gradient(ellipse 58% 56% at 50% 38%,
    #000 0%, rgba(0,0,0,.92) 30%, rgba(0,0,0,.62) 50%,
    rgba(0,0,0,.3) 68%, rgba(0,0,0,.08) 84%, transparent 94%);
  mask-image:radial-gradient(ellipse 58% 56% at 50% 38%,
    #000 0%, rgba(0,0,0,.92) 30%, rgba(0,0,0,.62) 50%,
    rgba(0,0,0,.3) 68%, rgba(0,0,0,.08) 84%, transparent 94%)}

.stats{display:flex;flex-wrap:wrap;gap:24px 34px;padding-top:24px;
  border-top:1px solid var(--line)}
.stat .n{font-family:var(--display);font-weight:800;font-size:30px;
  line-height:1;display:block}
body.fa .stat .n{font-family:var(--fa)}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}

section{padding:48px 0;border-bottom:1px solid var(--line)}
section h2{font-family:var(--display);font-weight:800;
  font-size:clamp(26px,6.5vw,40px);letter-spacing:-.02em;line-height:1.15;margin:0 0 16px}
body.fa section h2{font-family:var(--fa);letter-spacing:0;line-height:1.5}
section p{max-width:64ch;color:#CFCBC4;margin:0 0 16px}

/* roster plates */
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.roster a,.roster span{font-family:var(--mono);font-size:11.5px;
  letter-spacing:.09em;text-transform:uppercase;color:#B9B5AE;text-decoration:none;
  border:1px solid var(--line);border-radius:2px;padding:9px 13px;white-space:nowrap;
  transition:border-color .2s,color .2s}
body.fa .roster a,body.fa .roster span{font-family:var(--fa);font-size:13px;
  letter-spacing:0;text-transform:none}
.roster a:hover{border-color:var(--brass);color:var(--brass)}
.roster .more{color:var(--brass);border-color:rgba(194,168,120,.3)}

.band{margin:34px 0 0}
.band img{width:100%;display:block;border-radius:4px;border:1px solid var(--line)}

/* track cards — one unified component for every credit/release row,
   playable or not; only the play button vs. an equal-size empty spacer
   differs between them */
.trackcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;margin-top:22px}
.trackcard-wrap{display:flex;flex-direction:column}
.trackcard{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:6px;width:100%;padding:18px 14px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;font:inherit;font-family:var(--body);color:inherit}
body.fa .trackcard{font-family:var(--fa)}
button.trackcard{cursor:pointer;transition:border-color .2s}
button.trackcard:hover{border-color:var(--brass)}
button.trackcard[aria-expanded="true"]{border-color:var(--brass);
  border-end-start-radius:0;border-end-end-radius:0}
.tc-cover{width:88px;height:88px;flex:none;border-radius:4px;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line)}
.tc-img{width:100%;height:100%;object-fit:cover;display:block}
.tc-cover svg.thumb-fallback{width:100%;height:100%;padding:22px;box-sizing:border-box}
.tc-body{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;width:100%}
.tc-artist{font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--brass);
  letter-spacing:.02em;text-decoration:none}
body.fa .tc-artist{font-family:var(--fa)}
a.tc-artist:hover{text-decoration:underline}
.tc-artist-alt{font-size:11.5px;color:var(--muted)}
body:not(.fa) .tc-artist-alt{font-family:var(--fa);direction:rtl}
body.fa .tc-artist-alt{font-family:var(--mono);direction:ltr}
.tc-title{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.3;margin-top:4px}
body.fa .tc-title{font-family:var(--fa);direction:rtl}
.tc-title-pending{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}
.tc-title-alt{font-size:12.5px;color:var(--muted)}
body:not(.fa) .tc-title-alt{font-family:var(--fa);direction:rtl}
body.fa .tc-title-alt{font-family:var(--mono);direction:ltr}
.tc-roles{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px;min-height:19px}
.tc-role{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brass);border:1px solid rgba(194,168,120,.3);border-radius:2px;padding:2px 6px;
  white-space:nowrap}
.tc-play,.tc-play-spacer{width:32px;height:32px;flex:none;margin-top:4px}
.tc-play{border-radius:50%;border:1px solid var(--brass);color:var(--brass);background:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-family:inherit}
button.trackcard[aria-expanded="true"] .tc-play{background:var(--brass);color:var(--ink)}

.player{overflow:hidden}
.player iframe{display:block;width:100%;height:152px;border:0;
  border:1px solid var(--brass);border-top:0;
  border-end-start-radius:3px;border-end-end-radius:3px}

/* article pages */
.article{padding:40px 0 20px;max-width:720px}
.atitle{font-family:var(--display);font-weight:800;
  font-size:clamp(28px,7vw,44px);line-height:1.14;letter-spacing:-.02em;margin:0 0 16px}
body.fa .atitle{font-family:var(--fa);letter-spacing:0;line-height:1.5}
.stand{font-size:clamp(17px,4.4vw,20px);line-height:1.7;color:var(--text);margin:0 0 22px}
.article h3{font-family:var(--display);font-weight:800;font-size:20px;
  margin:38px 0 12px;color:var(--text)}
body.fa .article h3{font-family:var(--fa)}
.article p{font-size:17px;line-height:1.85;color:#C4C0B9;margin:0 0 18px;max-width:none}
.article blockquote{margin:30px 0;padding:0 0 0 20px;
  border-inline-start:2px solid var(--brass);font-size:19px;line-height:1.65;
  color:var(--brass);font-style:normal}
body.fa .article blockquote{padding:0 20px 0 0}

/* cover thumbnails (also used inside .tc-cover on track cards) */
.thumb{width:42px;height:42px;flex:none;border-radius:3px;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line);
  display:block;object-fit:cover}
.thumb.big{width:58px;height:58px;border-radius:4px}
.thumb-fallback{fill:var(--brass);opacity:.55;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .thumb-fallback{animation:thumb-pulse 3s ease-in-out infinite}
}
@keyframes thumb-pulse{
  0%,100%{opacity:.4;transform:scale(1) translateY(0)}
  50%{opacity:.8;transform:scale(1.08) translateY(-1.5px)}
}

/* release: video above the audio player */
.vidtop{border:1px solid var(--brass);border-top:0;padding:14px 14px 0}
.vidtop+.spslot iframe{border-top:0;border-radius:0}

/* homepage video reel */
.reel{margin-top:24px}
.reelstage{position:relative;width:100%;aspect-ratio:9/16;max-width:340px;
  margin:0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--line);
  background:#000}
.reelstage iframe,.reelstage>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.reelnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.reelnav button{font:inherit;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  background:none;color:var(--muted);border:1px solid var(--line);
  border-radius:2px;padding:8px 12px;transition:.2s}
body.fa .reelnav button{font-family:var(--fa);font-size:13px;
  letter-spacing:0;text-transform:none}
.reelnav button:hover{color:var(--text);border-color:var(--muted)}
.reelnav button.on{color:var(--brass);border-color:var(--brass)}

/* release extras: video + telegram */
.extra{border:1px solid var(--brass);border-top:0;
  border-end-start-radius:3px;border-end-end-radius:3px;padding:14px}
.ytwrap{position:relative;width:100%;aspect-ratio:9/16;max-width:280px;
  margin:0 auto 12px;border-radius:4px;overflow:hidden;background:#000}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tg{display:block;margin:0;text-align:center;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
  color:var(--brass);border:1px solid rgba(194,168,120,.4);border-radius:2px;
  padding:13px;border:1px solid var(--brass);border-top:0;border-end-start-radius:3px;border-end-end-radius:3px}
body.fa .tg{font-family:var(--fa);font-size:14px;letter-spacing:0;text-transform:none}
.tg:hover{background:var(--brass);color:var(--ink)}
.spslot iframe{border-end-start-radius:0;border-end-end-radius:0}

@media(min-width:700px){
  .reelstage{max-width:300px}
  .ytwrap{max-width:250px}
}

/* cards, gallery, posts */
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:22px 20px}
.card h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0 0 8px}
body.fa .card h3{font-family:var(--fa)}
.card p{font-size:15.5px;color:#B9B5AE;margin:0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.gal figure{margin:0}
.gal img{width:100%;display:block;border-radius:3px;border:1px solid var(--line)}
.gal figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);
  border-radius:3px;padding:26px;text-align:center}
.post{display:block;text-decoration:none;border-bottom:1px solid var(--line);padding:20px 0}
.post .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass)}
.post h3{font-family:var(--display);font-weight:800;font-size:20px;margin:6px 0}
body.fa .post h3{font-family:var(--fa)}
.post p{margin:0;font-size:15.5px;color:var(--muted)}

.btn{display:block;text-align:center;font-family:var(--mono);font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
  border:1px solid var(--brass);color:var(--brass);padding:15px 20px;border-radius:2px}
body.fa .btn{font-family:var(--fa);letter-spacing:0;text-transform:none;font-size:14px}
.linkrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
footer{padding:40px 0 60px}
footer p{font-size:14px;color:var(--muted);margin:0 0 12px}
footer a{color:var(--muted)}
footer a:hover{color:var(--brass)}

@media(min-width:700px){
  :root{--pad:32px}
  .masthead .wrap{display:flex;align-items:center;gap:28px;height:66px}
  .bar{padding:0;gap:20px}
  .nav{padding:0;overflow:visible;margin-inline-start:auto}
  .hero{padding:76px 0 60px}
  .herogrid{grid-template-columns:1.15fr .85fr;gap:56px}
  section{padding:66px 0}
  .grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .gal{grid-template-columns:repeat(3,1fr);gap:12px}
  .linkrow{flex-direction:row}
  .btn{display:inline-block}
}
</style>

<script>
(function(){
  // A fresh EmbedController is created for every track click and the
  // previous one is destroyed. Reusing a single controller via loadUri()
  // silently no-ops on any click after the first: loadUri() is async with
  // no documented 'ready'-again event, so a play() called right after it
  // can fire before the new URI has actually loaded. Recreating the
  // controller each time reuses the exact code path that already works
  // reliably for the very first click. loadSeq guards against a stale
  // controller (from a track the user already moved on from) winning the
  // race and hijacking playback once its createController callback lands.
  var API = null, controller = null, playerHost = null, activeBtn = null, loadSeq = 0;
  window.onSpotifyIframeApiReady = function(IFrameAPI){ API = IFrameAPI; };

  // Same approach for video: one shared YT.Player, reused across rows via
  // loadVideoById()+playVideo() inside the click handler. Because the
  // click is a real user gesture, unmuted playback isn't blocked, so the
  // video plays with sound instead of needing a manual unmute.
  // ytPlayerReady/desiredVideoId exist because YT.Player() is asynchronous:
  // the player isn't actually able to accept loadVideoById() until its
  // 'ready' event fires (real handshake delay, not instant like a mock), and
  // a call made before that is silently dropped rather than queued. Without
  // tracking readiness, clicking a second row before the first row's player
  // finishes initializing left every row playing whichever video happened
  // to land first. desiredVideoId always holds the most recently clicked
  // row's id, so whichever click's loadVideoById wins the race, onReady
  // (or the next post-ready click) still ends up loading the right video.
  var YTReady = false, ytPlayer = null, ytPlayerReady = false, ytVidTop = null, ytHost = null, desiredVideoId = null;
  window.onYouTubeIframeAPIReady = function(){ YTReady = true; };

  // The shared video element is moved here (not destroyed) when a row
  // closes, so reopening any row reuses the same live YT.Player instead of
  // recreating it.
  var parkingLot = null;
  function park(el){
    if(!parkingLot){
      parkingLot = document.createElement('div');
      parkingLot.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;';
      document.body.appendChild(parkingLot);
    }
    parkingLot.appendChild(el);
  }

  function stopVideo(){
    if(ytPlayer){ try{ ytPlayer.stopVideo(); }catch(err){} }
  }

  function clearExtras(b){
    var box = b.nextElementSibling;
    if(!box) return;
    // playerHost isn't parked for reuse: its controller is destroyed
    // whenever a track closes or switches, so the host itself is disposable.
    if(playerHost && playerHost.parentNode === box) box.removeChild(playerHost);
    if(ytVidTop && ytVidTop.parentNode === box) park(ytVidTop);
    var dl = box.querySelector('.tg'); if(dl) dl.remove();
    var legacy = box.querySelector('.spslot'); if(legacy) legacy.remove();
    var legacyVid = box.querySelector('.vidtop'); if(legacyVid) legacyVid.remove();
  }

  // releases: video sits above the audio player, download link below
  function addExtras(b, box, refNode){
    if(!b.dataset.yt) return;

    var ytStart = parseFloat(b.dataset.start) || 0;

    if(YTReady){
      if(!ytVidTop){
        ytVidTop = document.createElement('div');
        ytVidTop.className = 'vidtop';
        var ytWrap = document.createElement('div');
        ytWrap.className = 'ytwrap';
        ytHost = document.createElement('div');
        ytWrap.appendChild(ytHost);
        ytVidTop.appendChild(ytWrap);
      }
      box.insertBefore(ytVidTop, refNode);
      desiredVideoId = b.dataset.yt;
      if(!ytPlayer){
        ytPlayer = new YT.Player(ytHost, {
          videoId: b.dataset.yt,
          playerVars: { rel: 0, playsinline: 1, start: ytStart || undefined },
          events: { onReady: function(e){
            ytPlayerReady = true;
            try{ e.target.loadVideoById({ videoId: desiredVideoId, startSeconds: ytStart }); e.target.playVideo(); }catch(err){}
          } }
        });
      }else if(ytPlayerReady){
        try{ ytPlayer.loadVideoById({ videoId: desiredVideoId, startSeconds: ytStart }); ytPlayer.playVideo(); }catch(err){}
      }
      // else: the player exists but hasn't fired 'ready' yet. desiredVideoId
      // is already updated above, so the still-pending onReady handler above
      // will load the right (most recently clicked) video once it fires.
    }else{
      // Graceful fallback if the YouTube IFrame API failed to load.
      var vid = document.createElement('div');
      vid.className = 'vidtop';
      vid.innerHTML =
        '<div class="ytwrap"><iframe src="https://www.youtube.com/embed/'
        + b.dataset.yt + '?rel=0&playsinline=1&autoplay=1&mute=0'
        + (ytStart ? '&start=' + encodeURIComponent(ytStart) : '')
        + '" title="video" '
        + 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; '
        + 'gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
      box.insertBefore(vid, refNode);
    }

    var dl = document.createElement('a');
    dl.className = 'tg';
    dl.href = b.dataset.tg;
    dl.target = '_blank'; dl.rel = 'noopener noreferrer';
    dl.textContent = b.dataset.tglabel || 'Telegram';
    box.appendChild(dl);
  }

  function markActive(b){
    b.setAttribute('aria-expanded','true');
    var icon = b.querySelector('.play'); if(icon) icon.textContent = '⏸';
  }
  function resetRow(b){
    b.setAttribute('aria-expanded','false');
    var icon = b.querySelector('.play'); if(icon) icon.textContent = '▶';
  }

  function destroyController(){
    loadSeq++; // invalidate any in-flight createController callback
    if(controller){ try{ controller.destroy(); }catch(err){} controller = null; }
  }

  function openWithController(b){
    var box = b.nextElementSibling;
    clearExtras(b);
    destroyController();
    playerHost = document.createElement('div');
    box.appendChild(playerHost);
    addExtras(b, box, playerHost);
    markActive(b);
    activeBtn = b;

    // releases rows autoplay their video instead; don't also start audio.
    var shouldPlay = !b.dataset.yt;
    var startSeconds = parseFloat(b.dataset.start) || 0;
    var mySeq = loadSeq;

    API.createController(playerHost, {
      uri: b.dataset.uri, width: '100%', height: b.dataset.h || 152
    }, function(c){
      if(mySeq !== loadSeq){ try{ c.destroy(); }catch(err){} return; }
      controller = c;
      controller.addListener('ready', function(){
        if(mySeq !== loadSeq) return;
        try{
          if(startSeconds) controller.seek(startSeconds);
          if(shouldPlay) controller.play();
        }catch(err){}
      });
    });
  }

  // Graceful fallback if the IFrame API script failed to load: a plain
  // static embed, same as before one-click playback existed.
  function openLegacy(b){
    var box = b.nextElementSibling;
    clearExtras(b);
    var slot = document.createElement('div');
    slot.className = 'spslot';
    slot.innerHTML = '<iframe src="'+b.dataset.embed+'" '
      + 'allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" '
      + 'loading="lazy"></iframe>';
    box.appendChild(slot);
    addExtras(b, box, slot);
    markActive(b);
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button.sp');
    if(!b) return;

    var wasOpen = b.getAttribute('aria-expanded') === 'true';

    var openBtn = document.querySelector('button.sp[aria-expanded="true"]');
    if(openBtn && openBtn !== b){
      if(openBtn.dataset.yt) stopVideo();
      clearExtras(openBtn);
      resetRow(openBtn);
      if(openBtn === activeBtn) activeBtn = null;
    }

    if(wasOpen){
      destroyController();
      if(b.dataset.yt) stopVideo();
      clearExtras(b);
      resetRow(b);
      if(b === activeBtn) activeBtn = null;
      return;
    }

    if(API){ openWithController(b); }else{ openLegacy(b); }
  });
})();
</script>

  document.addEventListener('error', function(e){
    var img = e.target;
    if(img.tagName !== 'IMG' || !(img.classList.contains('thumb') || img.classList.contains('tc-img'))) return;

})();
