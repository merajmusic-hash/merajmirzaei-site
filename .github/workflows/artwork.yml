name: Fetch cover artwork

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch missing cover artwork
        run: node scripts/fetch-artwork.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install Pillow

      - name: Optimize website covers
        run: python scripts/optimize-covers.py

      - name: Commit new artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "merajmirzaei-site (4)"
          if git diff --cached --quiet; then
            echo "No new artwork to commit."
          else
            git commit -m "chore: add cover artwork"
            git push
          fi
